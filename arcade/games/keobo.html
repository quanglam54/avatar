<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Kéo Bò</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    #cv { width: 100%; max-width: 860px; height: auto; touch-action: manipulation; }
    .pull-btn {
      width: 150px; height: 150px; border-radius: 50%; border: 8px solid #2b1a10; cursor: pointer;
      background: radial-gradient(circle at 40% 35%, #ff8787, #e03131 55%, #a61e1e); color: #fff;
      font: 900 26px "Be Vietnam Pro", system-ui; text-shadow: 0 3px 0 #7a0e0e; box-shadow: 0 10px 0 #2b1a10, 0 0 0 10px #ced4da;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none;
    }
    .pull-btn:active, .pull-btn.hit { transform: translateY(7px); box-shadow: 0 3px 0 #2b1a10, 0 0 0 10px #ced4da; }
    .pad-wrap { display: flex; gap: 22px; align-items: center; justify-content: center; padding: 10px 0 6px; }
    .pad-wrap small { color: var(--muted); max-width: 200px; line-height: 1.4; }
  </style>
</head>
<body>
  <main class="game-layout">
    <section class="stage">
      <div class="hud">
        <div>Lượt kéo<b id="taps">0</b></div>
        <div>Thời gian<b id="time">30</b></div>
        <div>Màn<b id="level">1</b></div>
        <div>Kỷ lục<b data-best>—</b></div>
      </div>
      <div class="play-area" id="area"><canvas id="cv" width="860" height="520"></canvas></div>
      <div class="pad-wrap">
        <button class="pull-btn" id="pull">KÉO!</button>
        <small>Bấm nút đỏ (hoặc phím <b>Space</b>) thật nhanh để kéo bò của bạn về vạch đích trước 3 cao bồi kia!</small>
      </div>
    </section>
    <aside class="side" id="side"></aside>
  </main>

  <script src="../assets/common.js"></script>
  <script>
    GH.initGame('keobo');
    const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
    const area = document.getElementById('area'), btn = document.getElementById('pull');
    const W = cv.width, H = cv.height, LANES = 4, ME = 1, TOP = 175, GOAL = 380, TIME = 30;
    const COWS = [
      { body: '#ffe066', spot: '#fab005', name: 'Cao bồi Tí' },
      { body: '#dee2e6', spot: '#868e96', name: 'BẠN' },
      { body: '#e5dbff', spot: '#9775fa', name: 'Cao bồi Tèo' },
      { body: '#f8f9fa', spot: '#343a40', name: 'Cao bồi Bin' },
    ];
    let lanes, state = 'ready', timeLeft, level = 1, count = 0, last = 0, taps = 0, combo = 0, lastTap = 0, totalScore = 0, flash = [];

    const laneX = (i) => 140 + i * 193;

    function reset() {
      lanes = COWS.map((c, i) => ({
        ...c, p: 0, taps: 0, wob: Math.random() * 6, done: null,
        rate: i === ME ? 0 : 5.2 + level * 0.55 + Math.random() * 1.6, acc: 0, burst: 0,
      }));
      taps = 0; combo = 0; timeLeft = TIME;
      hud();
    }

    function hud() {
      document.getElementById('taps').textContent = taps;
      document.getElementById('time').textContent = Math.ceil(Math.max(0, timeLeft));
      document.getElementById('level').textContent = level;
    }

    function start() {
      area.querySelectorAll('.overlay').forEach((o) => o.remove());
      reset();
      state = 'count'; count = 2.99;
    }

    const PULL = 0.016, RESIST = 0.045;
    function pull(l, k = 1) {
      l.p = Math.min(1, l.p + PULL * k);
      l.taps++;
      l.jerk = 1;
      if (l.p >= 1 && l.done == null) { l.done = TIME - timeLeft; finish(); }
    }

    function tap() {
      if (state === 'ready') return start();
      if (state !== 'play') return;
      const now = performance.now();
      combo = now - lastTap < 160 ? Math.min(combo + 1, 20) : Math.max(0, combo - 3);
      lastTap = now;
      taps++;
      pull(lanes[ME], 1 + combo * 0.025);
      flash.push({ t: 0.35 });
      btn.classList.add('hit'); setTimeout(() => btn.classList.remove('hit'), 60);
      hud();
    }

    function finish() {
      if (state !== 'play') return;
      state = 'end';
      const order = lanes.map((l, i) => ({ i, p: l.done != null ? 2 - l.done / TIME : l.p })).sort((a, b) => b.p - a.p);
      const place = order.findIndex((o) => o.i === ME);
      const score = taps * 10 + [500, 250, 100, 0][place];
      totalScore += score;
      setTimeout(() => {
        if (place === 0) {
          GH.overlay(area, `<h2>🏆 Bạn thắng màn ${level}!</h2><p>Kéo ${taps} lượt · +${score} điểm<br>Màn sau các cao bồi kéo khoẻ hơn đó!</p>`, 'Màn tiếp theo ▶', () => { level++; start(); });
        } else {
          GH.gameOver(area, 'keobo', totalScore, { title: `Bạn về hạng ${place + 1} 🐄`, note: `Màn ${level} · ${taps} lượt kéo` }, () => { level = 1; totalScore = 0; start(); });
          level = 1; totalScore = 0;
        }
      }, 900);
    }

    function update(dt) {
      if (state === 'count') { count -= dt; if (count <= 0) state = 'play'; }
      lanes.forEach((l) => { l.jerk = Math.max(0, (l.jerk || 0) - dt * 6); l.wob += dt * (state === 'play' ? 9 : 2); });
      if (state !== 'play') return;
      timeLeft -= dt;
      lanes.forEach((l, i) => {
        if (l.done != null) return;
        // bò vùng vẫy kéo ngược lại, càng gần đích càng khoẻ
        l.p = Math.max(0, l.p - RESIST * (0.6 + l.p) * dt);
        if (i !== ME) {
          l.burst -= dt;
          if (l.burst < 0) l.burst = 0.6 + Math.random() * 1.4;
          const r = l.rate * (l.burst > 0.3 ? 1.15 : 0.8);
          l.acc += r * dt;
          while (l.acc >= 1) { l.acc -= 1; pull(l, 1.05); }
        }
      });
      flash.forEach((f) => { f.t -= dt; });
      flash = flash.filter((f) => f.t > 0);
      if (timeLeft <= 0) { timeLeft = 0; finish(); }
      hud();
    }

    function circle(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

    function drawScene() {
      const sky = ctx.createLinearGradient(0, 0, 0, 160);
      sky.addColorStop(0, '#74c0fc'); sky.addColorStop(1, '#ffe8cc');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, W, 160);
      ctx.fillStyle = '#e8b46a'; ctx.beginPath(); ctx.ellipse(160, 160, 260, 70, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#d9a05a'; ctx.beginPath(); ctx.ellipse(700, 165, 300, 60, 0, Math.PI, 0); ctx.fill();
      // chuồng xanh
      ctx.fillStyle = '#2f9e44'; ctx.fillRect(470, 40, 230, 110);
      ctx.fillStyle = '#2b8a3e'; ctx.beginPath(); ctx.moveTo(455, 44); ctx.lineTo(585, 6); ctx.lineTo(715, 44); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#c92a2a'; ctx.fillRect(560, 80, 50, 70);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(560, 80, 50, 70);
      ctx.beginPath(); ctx.moveTo(560, 80); ctx.lineTo(610, 150); ctx.moveTo(610, 80); ctx.lineTo(560, 150); ctx.stroke();
      // cây khô + cao bồi trên ngựa
      ctx.strokeStyle = '#7a4520'; ctx.lineWidth = 9; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(120, 160); ctx.lineTo(130, 60); ctx.moveTo(128, 90); ctx.lineTo(80, 60); ctx.moveTo(130, 75); ctx.lineTo(175, 45); ctx.stroke();
      ctx.font = '42px system-ui, "Segoe UI Emoji"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
      ctx.fillText('🤠', 420, 72); ctx.fillText('🐎', 800, 72);
      // nền đất
      const ground = ctx.createLinearGradient(0, 160, 0, H);
      ground.addColorStop(0, '#f3d9a4'); ground.addColorStop(1, '#d9b382');
      ctx.fillStyle = ground; ctx.fillRect(0, 160, W, H - 160);
      // hàng rào
      for (let x = 10; x < W; x += 34) {
        ctx.fillStyle = '#b97a3e'; ctx.fillRect(x, 140, 12, 44);
        ctx.fillStyle = '#dba468'; ctx.fillRect(x + 2, 142, 4, 40);
      }
      ctx.fillStyle = '#c98a4b'; ctx.fillRect(0, 150, W, 7); ctx.fillRect(0, 168, W, 7);
      // vạch đích
      ctx.setLineDash([16, 10]); ctx.strokeStyle = '#e03131'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(30, GOAL + 64); ctx.lineTo(W - 30, GOAL + 64); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#e03131'; ctx.font = '900 14px "Be Vietnam Pro", system-ui'; ctx.textAlign = 'left';
      ctx.fillText('VẠCH ĐÍCH', 34, GOAL + 80);
    }

    function drawCow(l, i) {
      const x = laneX(i), y = TOP + l.p * (GOAL - TOP);
      const shake = state === 'play' && l.done == null ? Math.sin(l.wob * 3) * 3 : 0;
      const jy = (l.jerk || 0) * 5;
      // dây thừng
      ctx.strokeStyle = '#a0602e'; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x + shake, y + 30); ctx.quadraticCurveTo(x + Math.sin(l.wob) * 8, (y + H) / 2 + 20, x, H - 6); ctx.stroke();
      ctx.strokeStyle = '#d9a05a'; ctx.lineWidth = 3; ctx.setLineDash([6, 6]);
      ctx.beginPath(); ctx.moveTo(x + shake, y + 30); ctx.quadraticCurveTo(x + Math.sin(l.wob) * 8, (y + H) / 2 + 20, x, H - 6); ctx.stroke(); ctx.setLineDash([]);
      ctx.save(); ctx.translate(x + shake, y + jy);
      // thân bò
      ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0, 46, 48, 12, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = l.body; ctx.beginPath(); ctx.ellipse(0, 18, 46, 32, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = l.spot;
      [[-20, 8, 11], [18, 22, 9], [-6, 30, 7], [24, 2, 6]].forEach(([sx, sy, r]) => circle(sx, sy, r, l.spot));
      // chân bám đất
      ctx.fillStyle = '#495057'; [-30, -12, 12, 30].forEach((lx) => ctx.fillRect(lx - 5, 40, 10, 12));
      // dây buộc quanh người
      ctx.strokeStyle = '#a0602e'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.ellipse(0, 22, 47, 10, 0, 0, Math.PI); ctx.stroke();
      // đầu
      ctx.fillStyle = l.body; ctx.beginPath(); ctx.ellipse(0, -22, 30, 26, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e9d8a6';
      ctx.beginPath(); ctx.moveTo(-22, -40); ctx.lineTo(-32, -58); ctx.lineTo(-14, -44); ctx.fill();
      ctx.beginPath(); ctx.moveTo(22, -40); ctx.lineTo(32, -58); ctx.lineTo(14, -44); ctx.fill();
      ctx.fillStyle = l.spot; ctx.beginPath(); ctx.ellipse(-30, -26, 9, 5, -0.5, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.ellipse(30, -26, 9, 5, 0.5, 0, Math.PI * 2); ctx.fill();
      // mắt nhắm tịt + miệng la hét
      ctx.strokeStyle = '#212529'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-15, -30); ctx.lineTo(-6, -26); ctx.lineTo(-15, -22); ctx.moveTo(15, -30); ctx.lineTo(6, -26); ctx.lineTo(15, -22); ctx.stroke();
      ctx.fillStyle = '#ffc9c9'; ctx.beginPath(); ctx.ellipse(0, -8, 18, 13, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#c2255c'; ctx.beginPath(); ctx.ellipse(0, -5, 10, 8 + Math.abs(Math.sin(l.wob * 2)) * 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff8787'; ctx.beginPath(); ctx.ellipse(0, -1, 6, 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      // số lượt kéo kiểu bảng điểm đỏ
      ctx.font = '900 26px "Be Vietnam Pro", system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.strokeText(String(l.taps).padStart(2, '0'), x, y - 66);
      ctx.fillStyle = '#e03131'; ctx.fillText(String(l.taps).padStart(2, '0'), x, y - 66);
      // tên người kéo dưới đáy
      ctx.fillStyle = i === ME ? '#ffd43b' : 'rgba(255,255,255,.85)';
      ctx.beginPath(); ctx.roundRect(x - 52, H - 34, 104, 24, 10); ctx.fill();
      ctx.fillStyle = i === ME ? '#3d2410' : '#495057'; ctx.font = '800 13px "Be Vietnam Pro", system-ui';
      ctx.fillText(l.done != null ? '🏁 ' + l.name : l.name, x, H - 22);
      if (i === ME) {
        ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.moveTo(x - 10, H - 46); ctx.lineTo(x + 10, H - 46); ctx.lineTo(x, H - 36); ctx.closePath(); ctx.fill();
      }
    }

    function draw() {
      drawScene();
      lanes.forEach((l, i) => drawCow(l, i));
      // combo
      if (state === 'play' && combo > 4) {
        ctx.font = '900 24px "Be Vietnam Pro", system-ui'; ctx.textAlign = 'center';
        ctx.lineWidth = 5; ctx.strokeStyle = '#3d2410'; ctx.strokeText(`🔥 COMBO x${combo}`, laneX(ME), 220);
        ctx.fillStyle = '#ffd43b'; ctx.fillText(`🔥 COMBO x${combo}`, laneX(ME), 220);
      }
      if (state === 'count') {
        const n = Math.ceil(count);
        ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0, 0, W, H);
        ctx.font = '900 120px "Be Vietnam Pro", system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 10; ctx.strokeStyle = '#3d2410'; ctx.strokeText(n > 0 ? n : 'KÉO!', W / 2, H / 2);
        ctx.fillStyle = n > 0 ? '#ffd43b' : '#ff6b6b'; ctx.fillText(n > 0 ? n : 'KÉO!', W / 2, H / 2);
      }
      // đồng hồ
      ctx.fillStyle = 'rgba(20,28,45,.75)'; ctx.beginPath(); ctx.roundRect(12, 12, 120, 40, 10); ctx.fill();
      ctx.fillStyle = timeLeft < 8 ? '#ff8787' : '#fff'; ctx.font = '900 22px "Be Vietnam Pro", system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(`⏱ ${Math.ceil(Math.max(0, timeLeft))}s`, 24, 32);
    }

    function loop(t) {
      const dt = Math.min(0.05, (t - (last || t)) / 1000);
      last = t;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    btn.addEventListener('pointerdown', (e) => { e.preventDefault(); tap(); });
    document.addEventListener('keydown', (e) => {
      if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); tap(); }
    });

    reset();
    requestAnimationFrame(loop);
    GH.overlay(area, '<h2>🐄 Kéo Bò</h2><p>Bấm nút <b>KÉO!</b> thật nhanh để kéo bò về vạch đích.<br>Bò vùng vẫy kéo ngược lại — đừng dừng tay!</p>', 'Bắt đầu', start);
  </script>
</body>
</html>
