<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Tắc Kè Hoa · Trốn Tìm Ngụy Trang 3D</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --glass: rgba(16, 18, 32, .8); --line: rgba(255, 255, 255, .13); --acc: #8b5cf6; --acc2: #ec4899; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f18; color: #fff; font-family: "Be Vietnam Pro", system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
    #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .glass { background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    #tags { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
    #tags span { position: absolute; transform: translate(-50%, -100%); font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 9px; white-space: nowrap; background: rgba(15, 18, 32, .72); }
    #tags span.me { background: rgba(139, 92, 246, .92); }
    #tags span.s { background: rgba(234, 88, 12, .92); }
    #tags span.h { opacity: .6; }
    .hud-top { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 6; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
    .timer { display: flex; align-items: center; gap: 12px; padding: 7px 16px 7px 10px; border-radius: 18px; }
    .timer .ph { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 10px; background: rgba(255, 255, 255, .1); white-space: nowrap; }
    .timer .t { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; min-width: 66px; text-align: center; }
    .timer .cnt { font-size: 13px; font-weight: 800; color: #cbd5e1; white-space: nowrap; }
    .bar { width: 100%; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .12); overflow: hidden; }
    .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--acc), var(--acc2)); transition: width .3s linear; }
    .role { position: fixed; top: 10px; left: 10px; z-index: 6; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 16px; pointer-events: none; }
    .role .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; background: linear-gradient(135deg, var(--acc), var(--acc2)); }
    .role b { display: block; font-size: 14px; }
    .role small { font-size: 11.5px; color: #cbd5e1; }
    .tr { position: fixed; top: 10px; right: 10px; z-index: 6; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .icbtn { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 18px; border: 1px solid var(--line); }
    #mini { border-radius: 14px; border: 1px solid var(--line); background: rgba(10, 12, 20, .7); }
    .dock { position: fixed; right: 12px; bottom: 30px; z-index: 6; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .dock .row { display: flex; gap: 10px; }
    .big { width: 62px; height: 62px; border-radius: 20px; border: 1px solid var(--line); display: grid; place-items: center; font-size: 26px; position: relative; box-shadow: 0 6px 18px rgba(0, 0, 0, .35); }
    .big span { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 10.5px; font-weight: 800; white-space: nowrap; text-shadow: 0 1px 3px #000; }
    .big.pri { background: linear-gradient(135deg, var(--acc), var(--acc2)); border: 0; }
    .big:active { transform: scale(.94); }
    .big[disabled] { opacity: .45; }
    .camo { width: 220px; padding: 8px 12px; border-radius: 14px; font-size: 12px; font-weight: 800; }
    .camo .bar { height: 7px; margin-top: 5px; }
    .camo .bar i { background: linear-gradient(90deg, #ef4444, #fbbf24, #22c55e); }
    .ammo { padding: 10px 16px; border-radius: 16px; font-size: 18px; font-weight: 900; }
    .hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 5; padding: 7px 14px; border-radius: 12px; font-size: 12.5px; font-weight: 700; pointer-events: none; text-align: center; max-width: min(540px, 56vw); color: #e2e8f0; }
    #cross { position: fixed; left: 50%; top: 50%; width: 30px; height: 30px; transform: translate(-50%, -50%); z-index: 4; pointer-events: none; display: none; }
    #cross::before, #cross::after { content: ""; position: absolute; background: rgba(255, 255, 255, .9); box-shadow: 0 0 3px #000; }
    #cross::before { left: 14px; top: 0; width: 2px; height: 30px; }
    #cross::after { top: 14px; left: 0; height: 2px; width: 30px; }
    #blind { position: fixed; inset: 0; z-index: 7; background: #05050f; display: none; place-items: center; text-align: center; }
    #blind b { display: block; font-size: 30px; }
    #blind .n { font-size: 80px; font-weight: 900; color: #fde047; }

    /* --- bảng tô màu --- */
    .drawer { position: fixed; z-index: 8; right: 12px; top: 64px; width: 330px; max-height: calc(100vh - 80px); overflow: auto; border-radius: 20px; padding: 12px; display: none; }
    .drawer.show { display: block; animation: up .18s; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } }
    .dr-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .dr-h b { font-size: 15px; }
    .x { width: 30px; height: 30px; border-radius: 10px; border: 0; background: rgba(255, 255, 255, .1); }
    .chipb { border: 1px solid var(--line); background: rgba(255, 255, 255, .07); border-radius: 10px; padding: 8px 6px; font-size: 12.5px; font-weight: 800; }
    .chipb.on, .chipb.pri { background: linear-gradient(135deg, var(--acc), var(--acc2)); border-color: transparent; }
    .tools3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .sl { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; color: #cbd5e1; margin: 10px 0 2px; }
    input[type=range] { width: 100%; accent-color: var(--acc2); }
    .colrow { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
    .cur { width: 44px; height: 44px; border-radius: 12px; border: 3px solid rgba(255, 255, 255, .6); }
    .colrow span { font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
    #sv { width: 100%; height: 120px; border-radius: 12px; display: block; touch-action: none; cursor: crosshair; }
    #hue { margin: 8px 0 2px; height: 14px; -webkit-appearance: none; appearance: none; border-radius: 8px; background: linear-gradient(90deg, red, #ff0, lime, cyan, blue, #f0f, red); }
    #hue::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid #111; }
    .sw { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .sw button { width: 26px; height: 26px; border-radius: 8px; border: 2px solid rgba(255, 255, 255, .3); padding: 0; }
    .acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
    .tip { font-size: 11.5px; color: #94a3b8; margin: 8px 0 0; line-height: 1.45; }
    .pose { position: fixed; z-index: 8; right: 12px; bottom: 120px; border-radius: 18px; padding: 10px; display: none; grid-template-columns: repeat(5, 58px); gap: 6px; }
    .pose.show { display: grid; animation: up .18s; }
    .pose button { height: 64px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, .07); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 22px; gap: 2px; }
    .pose button small { font-size: 9.5px; font-weight: 800; }
    .pose button.on { background: linear-gradient(135deg, var(--acc), var(--acc2)); }
    .ov { position: fixed; inset: 0; z-index: 10; display: none; place-items: center; background: rgba(5, 6, 14, .6); padding: 12px; }
    .ov.show { display: grid; }
    .card { width: min(760px, 96vw); max-height: 92vh; overflow: auto; border-radius: 24px; padding: 18px; animation: up .2s; }
    .card h2 { margin: 0; font-size: 24px; }
    .card .sub { margin: 4px 0 14px; color: #cbd5e1; font-size: 13.5px; }
    .lbl { font-size: 11.5px; font-weight: 900; letter-spacing: .08em; color: #94a3b8; text-transform: uppercase; margin: 14px 0 8px; }
    .maps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .mapc { border: 2px solid var(--line); border-radius: 16px; overflow: hidden; background: rgba(255, 255, 255, .05); padding: 0; text-align: left; position: relative; }
    .mapc .th { width: 100%; aspect-ratio: 3 / 2; background: #1e293b center / cover; display: grid; place-items: center; font-size: 40px; }
    .mapc div.t { padding: 7px 9px; }
    .mapc b { font-size: 13.5px; display: block; }
    .mapc small { font-size: 11px; color: #94a3b8; }
    .mapc.on { border-color: #fde047; box-shadow: 0 0 0 2px #fde047; }
    .mapc .votes { position: absolute; top: 6px; right: 6px; background: rgba(0, 0, 0, .7); border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 900; }
    .seg { display: flex; gap: 8px; flex-wrap: wrap; }
    .seg button { border: 1px solid var(--line); background: rgba(255, 255, 255, .06); border-radius: 12px; padding: 9px 14px; font-weight: 800; font-size: 13.5px; }
    .seg button.on { background: linear-gradient(135deg, var(--acc), var(--acc2)); border-color: transparent; }
    .seg button small { display: block; font-size: 10.5px; font-weight: 600; opacity: .8; }
    .plist { display: flex; flex-wrap: wrap; gap: 6px; }
    .plist span { background: rgba(255, 255, 255, .08); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; }
    .plist span.me { background: rgba(253, 224, 71, .18); color: #fde68a; }
    .foot { display: flex; gap: 10px; justify-content: flex-end; align-items: center; margin-top: 16px; flex-wrap: wrap; }
    .foot .note { margin-right: auto; color: #cbd5e1; font-size: 13px; }
    .cbtn { border: 1px solid var(--line); background: rgba(255, 255, 255, .08); border-radius: 14px; padding: 11px 18px; font-weight: 800; font-size: 15px; }
    .cbtn.pri { background: linear-gradient(135deg, var(--acc), var(--acc2)); border: 0; }
    .cbtn[disabled] { opacity: .45; }
    .rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .rules div { background: rgba(255, 255, 255, .05); border-radius: 14px; padding: 10px; font-size: 12.5px; line-height: 1.45; color: #e2e8f0; }
    .rules b { display: block; font-size: 13px; margin-bottom: 2px; }
    .res { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
    .res td { padding: 8px 6px; border-bottom: 1px solid var(--line); }
    .res td:last-child { text-align: right; font-weight: 800; }
    .win { font-size: 32px; font-weight: 900; text-align: center; background: linear-gradient(90deg, #fde047, #f472b6); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #toasts { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); display: grid; gap: 6px; z-index: 20; pointer-events: none; width: max-content; max-width: 92vw; }
    .toast { padding: 9px 16px; border-radius: 14px; font-weight: 700; font-size: 14px; text-align: center; animation: up .2s; }
    #joy { position: fixed; z-index: 4; width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 50%; background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.25); pointer-events: none; display: none; }
    #joy i { position: absolute; left: 30px; top: 30px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.6); }
    #loading { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: #0d0f18; font-weight: 800; font-size: 18px; }
    @media (max-width: 640px) {
      .maps { grid-template-columns: repeat(2, 1fr); }
      .rules { grid-template-columns: 1fr; }
      .role { top: 64px; left: 8px; padding: 6px 12px 6px 6px; }
      .role .ic { width: 30px; height: 30px; font-size: 16px; }
      .role small { display: none; }
      .tr { top: 64px; right: 8px; }
      .icbtn { width: 36px; height: 36px; font-size: 16px; }
      .timer .ph { display: none; }
      .timer .t { font-size: 20px; min-width: 54px; }
      #mini { width: 110px; height: 76px; }
      .hint { display: none; }
      .camo { width: 170px; }
      .big { width: 56px; height: 56px; font-size: 23px; }
      .drawer { left: 6px; right: 6px; top: auto; bottom: 6px; width: auto; max-height: 50vh; }
      .pose { left: 8px; right: 8px; grid-template-columns: repeat(5, 1fr); }
      #toasts { top: 112px; }
      .card { padding: 14px; }
    }
  </style>
</head>
<body>
  <canvas id="cv"></canvas>
  <div id="tags"></div>
  <div id="joy"><i></i></div>
  <div id="blind"><div><b>🙈 Đang bịt mắt đếm…</b><div class="n" id="blindN">0</div><small id="blindSub" style="color:#94a3b8"></small></div></div>

  <div class="hud-top">
    <div class="timer glass"><span class="ph" id="cPhase">PHÒNG CHỜ</span><span class="t" id="cTime">--:--</span><span class="cnt" id="cCnt"></span></div>
    <div class="bar" style="width:200px"><i id="cBar" style="width:0"></i></div>
  </div>
  <div class="role glass"><div class="ic" id="rIc">🧍</div><div><b id="rName">Đang chờ</b><small id="rSub"></small></div></div>
  <div class="tr">
    <div style="display:flex;gap:8px">
      <button class="icbtn glass" id="bLobby" title="Phòng chờ">📋</button>
      <button class="icbtn glass" id="bMute" title="Âm thanh">🔊</button>
    </div>
    <canvas id="mini" width="150" height="100"></canvas>
  </div>

  <div class="dock">
    <div class="camo glass" id="camoBox" style="display:none">🦎 Độ ngụy trang: <span id="camoTxt">0%</span><div class="bar"><i id="camoBar" style="width:0"></i></div></div>
    <div class="ammo glass" id="ammoBox" style="display:none">🔫 <span id="ammoTxt">30</span></div>
    <div class="row" id="hideBtns" style="display:none">
      <button class="big glass" id="bTaunt" title="Huýt sáo trêu (T) · +5 xu">📢<span>Huýt sáo</span></button>
      <button class="big glass" id="bPose" title="Tạo dáng (Q)">🧍<span>Tạo dáng</span></button>
      <button class="big pri" id="bPaint" title="Tô màu người (F)">🎨<span>Tô màu</span></button>
    </div>
  </div>
  <div class="hint glass" id="hint"></div>

  <div class="drawer glass" id="paint">
    <div class="dr-h"><b>🎨 Tô màu người</b><button class="x" id="pClose">✕</button></div>
    <div class="tools3">
      <button class="chipb on" data-tool="brush">🖌️ Cọ</button>
      <button class="chipb" data-tool="fill">🪣 Đổ cả phần</button>
      <button class="chipb" data-tool="drop">🧪 Hút màu</button>
    </div>
    <div class="sl"><span>Cỡ cọ</span><b id="bsz">10</b></div>
    <input type="range" id="brush" min="2" max="40" value="10">
    <div class="colrow"><div class="cur" id="cur"></div><span id="curHex">#FFFFFF</span></div>
    <canvas id="sv" width="300" height="120"></canvas>
    <input type="range" id="hue" min="0" max="359" value="30">
    <div class="sw" id="recent"></div>
    <div class="acts">
      <button class="chipb" id="pUndo">↶ Hoàn tác</button>
      <button class="chipb" id="pClear">⬜ Xoá hết</button>
      <button class="chipb pri" id="pDone">✅ Xong</button>
    </div>
    <p class="tip">🖌️ Kéo lên người để tô · kéo ra chỗ trống để xoay người · 🧪 chạm vào tường / đồ vật để lấy đúng màu đó · nhớ tô cả lưng, khuỷu tay, đầu!</p>
  </div>
  <div class="pose glass" id="poseBox">
    <button data-pose="0">🧍<small>Đứng</small></button>
    <button data-pose="1">🪨<small>Thu lu</small></button>
    <button data-pose="2">🛌<small>Nằm</small></button>
    <button data-pose="3">🙆<small>Dang tay</small></button>
    <button data-pose="4">🪑<small>Ngồi</small></button>
  </div>
  <div id="toasts"></div>
  <div class="ov" id="ovLobby"><div class="card glass" id="lobbyCard"></div></div>
  <div class="ov" id="ovEnd"><div class="card glass" id="endCard" style="width:min(460px,94vw)"></div></div>
  <div id="loading">🦎 Đang dựng bản đồ 3D…</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  (() => {
    if (!window.THREE) { document.getElementById('loading').textContent = '⚠️ Không tải được thư viện 3D — kiểm tra mạng rồi mở lại'; return; }
    /* ================= Thiết lập chung ================= */
    const Q = new URLSearchParams(location.search);
    const ME = Q.get('pid') || 'solo' + Math.random().toString(36).slice(2, 8);
    const MYNAME = (Q.get('name') || 'Bạn').slice(0, 16);
    const SID = Q.get('sid') || '';
    const cleanRoom = (r) => String(r || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
    let ROOM = cleanRoom(Q.get('room'));
    const EMBED = parent !== window;
    const $ = (id) => document.getElementById(id);
    const rand = (n) => Math.floor(Math.random() * n);
    const pick = (a) => a[rand(a.length)];
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    function seeded(seed) { let s = seed >>> 0 || 1; return () => { s = (Math.imul(s ^ (s >>> 15), 2246822507) + 0x6d2b79f5) >>> 0; return (s >>> 8) / 16777216; }; }
    const FONT = '"Be Vietnam Pro", system-ui, sans-serif';
    const hexRgb = (h) => { const n = parseInt(String(h).slice(1, 7), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
    const rgbHex = (r, g, b) => '#' + [r, g, b].map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');

    const HIDE_MS = 45000, SEEK_MS = 180000, END_MS = 10000, AUTO_MS = 25000;
    const AMMO = 30, RANGE = 22, TAUNT_MAX = 5, WH = 3.2;
    const SPEED = { h: 3.2, s: 3.7, g: 6, w: 6, l: 3.7 };
    const PS = 128; // độ phân giải vải tô mỗi bộ phận
    const PART_NAMES = ['Đầu', 'Thân', 'Tay trái', 'Tay phải', 'Chân trái', 'Chân phải'];
    const PART_W = [0.15, 0.35, 0.1, 0.1, 0.15, 0.15];
    const SEEKCOL = ['#f1f0ec', '#ecebe6', '#f1f0ec', '#f1f0ec', '#e6e5df', '#e6e5df'];

    /* ================= Hoạ tiết vẽ bằng code ================= */
    function wrapDraw(W, H, fn, x, y, m = 40) {
      for (const dx of [-W, 0, W]) for (const dy of [-H, 0, H]) {
        if (x + dx < -m || x + dx > W + m || y + dy < -m || y + dy > H + m) continue;
        fn(x + dx, y + dy);
      }
    }

    const DEFS = {
      white: [128, 128, (g, W, H, R) => { g.fillStyle = '#f2f0ea'; g.fillRect(0, 0, W, H); for (let i = 0; i < 140; i++) { g.fillStyle = `rgba(120,110,90,${R() * 0.1})`; g.fillRect(R() * W, R() * H, 2, 2); } }],
      brick: [128, 128, (g, W, H, R) => {
        g.fillStyle = '#cdbba7'; g.fillRect(0, 0, W, H);
        for (let r = 0; r < 4; r++) for (let k = -1; k < 3; k++) {
          const x = k * 64 + (r % 2) * 32, y = r * 32;
          g.fillStyle = pickR(['#a4553f', '#b4613f', '#924936', '#ab5a44', '#9c5038'], R); g.fillRect(x + 3, y + 3, 58, 26);
          g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(x + 3, y + 3, 58, 5);
          for (let i = 0; i < 5; i++) { g.fillStyle = `rgba(60,20,10,${0.08 + R() * 0.12})`; g.fillRect(x + 4 + R() * 52, y + 4 + R() * 22, 3, 3); }
        }
      }],
      graffiti: [256, 256, (g, W, H, R) => {
        DEFS.brick[2](g, 128, 128, R); const t = g.getImageData(0, 0, 128, 128);
        g.putImageData(t, 128, 0); g.putImageData(t, 0, 128); g.putImageData(t, 128, 128);

      $('cPhase').textContent = PH[R.ph];
      $('cTime').textContent = R.ph === 'lobby' ? (R.auto ? `${Math.ceil((R.auto - Date.now()) / 1000)}s` : '--:--') : `${Math.floor(left / 60000)}:${String(Math.floor(left / 1000) % 60).padStart(2, '0')}`;
      $('cBar').style.width = R.ph === 'lobby' ? '0%' : `${(left / Math.max(1, R.dur)) * 100}%`;
      const alive = Object.values(R.roles).filter((r) => r === 'h').length, sk = Object.values(R.roles).filter((r) => r === 's').length;
      $('cCnt').textContent = R.ph === 'lobby' ? `👥 ${humans().length}` : `🫥 ${alive} · 🔫 ${sk}`;
      const rl = RL[me.r] || RL.l;
      $('rIc').textContent = rl[0]; $('rName').textContent = rl[1] + (ROOM ? ` · 🔒 ${ROOM}` : ''); $('rSub').textContent = R.ph === 'lobby' ? rl[2] : `${MAP.icon} ${MAP.name} · ${rl[2]}`;
      const hid = me.r === 'h' && (R.ph === 'hide' || R.ph === 'seek');
      $('hideBtns').style.display = hid && !paintMode ? 'flex' : 'none';
      $('camoBox').style.display = hid ? '' : 'none';
      $('bTaunt').disabled = R.ph !== 'seek' || tauntCd > 0;
      $('ammoBox').style.display = me.r === 's' && R.ph !== 'lobby' ? '' : 'none';
      $('ammoTxt').textContent = `${ammo}/${AMMO}`;
      $('camoTxt').textContent = Math.round(camo * 100) + '%'; $('camoBar').style.width = Math.round(camo * 100) + '%';
      $('bLobby').style.display = R.ph === 'lobby' ? '' : 'none';
      if (!hid) { closeTools(); if (paintMode) exitPaint(false); }
      document.querySelectorAll('[data-pose]').forEach((b) => b.classList.toggle('on', +b.dataset.pose === me.o));
      $('bPose').firstChild.textContent = ['🧍', '🪨', '🛌', '🙆', '🪑'][me.o] || '🧍';
      const touch = matchMedia('(pointer: coarse)').matches;
      let hint = '';
      if (paintMode) hint = '';
      else if (me.r === 'h' && R.ph === 'hide') hint = 'Áp lưng vào tường / đồ vật → 🎨 Tô màu (🧪 hút màu từ tường rồi tô) → tạo dáng. Kéo chuột để xoay nhìn';
      else if (me.r === 'h' && R.ph === 'seek') hint = 'Đứng im! 📢 Huýt sáo trêu để được thêm xu (nhưng dễ lộ)';
      else if (me.r === 's' && R.ph === 'seek') hint = touch ? 'Kéo bên trái để đi · kéo bên phải để xoay · chạm chỗ khả nghi để bắn 🔫' : 'WASD để đi · kéo chuột để xoay · bấm để bắn 🔫 — soi viền người, mặt cười, màu lệch';
      else if (me.r === 'g' || me.r === 'w') hint = 'Bạn đang bay xem — xuyên tường đi khắp nơi 👻';
      else if (R.ph === 'lobby') hint = touch ? 'Kéo bên trái để đi, kéo bên phải để xoay — đi dạo thử bản đồ' : 'WASD để đi, kéo chuột để xoay, cuộn để zoom — đi dạo thử bản đồ';
      $('hint').textContent = hint; $('hint').style.display = hint ? '' : 'none';
      if ($('ovLobby').classList.contains('show')) { renderLobby(); const n = $('lobNote'); if (n && R.auto) n.innerHTML = `⏱ Tự bắt đầu sau <b>${Math.ceil((R.auto - Date.now()) / 1000)}</b> giây`; }
    }

    /* ----- ảnh nhỏ bản đồ cho phòng chờ ----- */
    const THUMBS = {};
    function makeThumbs() {
      let rr = null;
      try { rr = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); rr.setSize(330, 220); } catch (e) { return; }
      const ids = MAP_IDS.slice();
      const next = () => {
        const id = ids.shift(); if (!id) { rr.dispose(); rr.forceContextLoss && rr.forceContextLoss(); lobbySig = ''; if ($('ovLobby').classList.contains('show')) renderLobby(); return; }
        const M = MAPS[id], sc = new THREE.Scene(), g = buildMap(M);
        // bỏ trần để nhìn từ trên xuống
        g.children.forEach((o) => { if (o.position && Math.abs(o.position.y - WH) < 0.01 && o.rotation.x > 1) o.visible = false; });
        sc.add(g, new THREE.AmbientLight(0xffffff, 0.75), new THREE.HemisphereLight(0xffffff, 0x777777, 0.5));
        sc.background = new THREE.Color('#141821');
        const cam = new THREE.PerspectiveCamera(45, 1.5, 0.1, 200);
        cam.position.set(M.W / 2, Math.max(M.W, M.D) * 0.95, M.D * 1.15); cam.lookAt(M.W / 2, 0, M.D / 2 - 0.5);
        rr.render(sc, cam); THUMBS[id] = rr.domElement.toDataURL('image/jpeg', 0.8);
        g.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
        setTimeout(next, 30);
      };
      setTimeout(next, 60);
    }
    function joinRoom(code) {
      code = cleanRoom(code);
      if (code === ROOM) return;
      net({ k: 'bye' });
      ROOM = code;
      try { if (EMBED) parent.postMessage({ type: 'hide-room', room: ROOM }, '*'); } catch (e) { /* bỏ qua */ }
      peers.forEach(dropBody); peers.clear(); bots.forEach(dropBody); bots.length = 0;
      R = { ph: 'lobby', end: 0, dur: 1, no: 0, roles: {}, names: {}, win: null, bots: true, auto: 0, caught: {}, catches: {}, map: R.map, mode: 'classic' };
      rewarded = -1; myRoundRole = null; me.r = 'l'; me.o = 0; me.parts = null; dropBody(me); exitPaint(false);
      placeInLobby(me); lastSent = ''; sendT = 0;
      toast(ROOM ? `🔒 Đã vào phòng riêng ${ROOM} — gửi mã này cho bạn bè hoặc bấm ✉️ Mời` : '🌐 Đã về phòng chung', 3500);
      lobbySig = ''; showLobby();
    }
    let invOpen = false, invData = null, invSent = new Set(), roomTyped = '';
    addEventListener('message', (e) => { const m = e.data || {}; if (m.type === 'hide-friends-list') { invData = m; lobbySig = ''; renderLobby(); } });
    function sendInvite(to, toPid) {
      try { parent.postMessage({ type: 'hide-invite', to, toPid, room: ROOM }, '*'); } catch (e) { return; }
      invSent.add(to || toPid); toast('✉️ Đã gửi lời mời', 1500); lobbySig = ''; renderLobby();
    }
    function inviteHtml() {
      if (!invOpen) return '';
      if (!EMBED) return '<div class="tip">✉️ Mời bạn bè chỉ dùng được khi chơi trong game Avatar. Ở đây hãy gửi mã phòng cho bạn.</div>';
      if (!invData) return '<div class="tip">Đang tải danh sách bạn bè…</div>';
      const btn = (key, label, attr, on) => `<button class="${invSent.has(key) ? '' : 'on'}" ${attr} ${invSent.has(key) ? 'disabled' : ''}>${invSent.has(key) ? '✅ ' : '✉️ '}${esc(label)}${on === false ? ' <small>(offline)</small>' : on ? ' <small>🟢 online</small>' : ''}</button>`;
      const fr = invData.friends || [], near = invData.near || [];
      if (!fr.length && !near.length) return `<div class="tip">${invData.me ? 'Bạn chưa có bạn bè nào — kết bạn ở nút 👥 Bạn bè trong game nhé.' : 'Đăng nhập tài khoản để mời bạn bè.'} Hoặc gửi mã phòng cho bạn tự nhập.</div>`;
      return `<div class="seg" style="margin-top:8px">${fr.map((f) => btn(f.u, f.n, `data-inv-u="${esc(f.u)}"`, f.on)).join('')}${near.map((r) => btn(r.p, '🧑 ' + r.n, `data-inv-p="${esc(r.p)}"`, true)).join('')}</div>
        <div class="tip">Bạn bè đang online ở khu nào cũng nhận được lời mời — bấm nhận là tự bay tới và vào đúng phòng này. Người offline sẽ không nhận được.</div>`;
    }
    function showLobby() { if (R.ph !== 'lobby') return; $('ovLobby').classList.add('show'); lobbySig = ''; renderLobby(); ui(); }
    let lobbySig = '';
    function renderLobby() {
      const host = isHost(), hs = humans();
      const votes = {}; hs.forEach((p) => { if (p.vt) votes[p.vt] = (votes[p.vt] || 0) + 1; });
      const sig = JSON.stringify([host, hs.map((p) => p.n + p.u), me.pf, me.vt, votes, R.bots, R.mode, !!R.auto, Object.keys(THUMBS).length, ROOM, invOpen, invData && [invData.friends, invData.near], [...invSent]]);
      if (sig === lobbySig) return; lobbySig = sig;
      const total = hs.length + (R.bots ? Math.max(0, 5 - hs.length) : 0);
      $('lobbyCard').innerHTML = `
        <h2>🦎 Tắc Kè Hoa 3D</h2>
        <div class="sub">Trốn tìm ngụy trang nhiều người — cầm cọ tự tô người cho giống bức tường sau lưng, tạo dáng, đứng im. Người tìm cầm súng săn 🔫</div>
        <div class="rules">
          <div><b>🖌️ Tự tô từng chỗ</b>Kéo cọ lên người hình nhân, 🪣 đổ màu cả bộ phận, 🧪 hút đúng màu tường / đồ vật.</div>
          <div><b>🙆 Tạo dáng</b>Đứng, thu lu, nằm, dang tay, ngồi. Áp lưng vào tường hoặc đồ vật là khó thấy nhất.</div>
          <div><b>🎁 Thưởng xu</b>Trốn sống sót +50 · bị bắt +10 · bắt 1 người +15 · huýt sáo +5.</div>
        </div>
        <div class="lbl">Phòng chơi · rủ bạn bè</div>
        <div class="seg" style="align-items:center">
          <span class="plist"><span class="${ROOM ? 'me' : ''}">${ROOM ? `🔒 Phòng riêng · mã <b>${ROOM}</b>` : '🌐 Phòng chung — ai vào cũng gặp'}</span></span>
          ${ROOM ? '<button id="pubRoom">🌐 Về phòng chung</button>' : '<button id="mkRoom">🔒 Tạo phòng riêng</button>'}
          <button id="invBtn" class="on">✉️ Mời bạn bè</button>
        </div>
        <div class="seg" style="margin-top:8px;align-items:center">
          <input id="roomIn" maxlength="6" placeholder="Nhập mã phòng" value="${esc(roomTyped)}" style="flex:0 1 150px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-weight:800;text-transform:uppercase;letter-spacing:.1em">
          <button id="roomGo">🔑 Vào phòng</button>
        </div>
        ${inviteHtml()}
        <div class="lbl">Bình chọn bản đồ ${me.vt ? '' : '· chạm để chọn & đi dạo thử'}</div>
        <div class="maps">${MAP_IDS.map((id) => `<button class="mapc ${me.vt === id ? 'on' : ''}" data-map="${id}"><div class="th" style="${THUMBS[id] ? `background-image:url(${THUMBS[id]})` : ''}">${THUMBS[id] ? '' : MAPS[id].icon}</div><div class="t"><b>${MAPS[id].icon} ${MAPS[id].name}</b><small>${MAPS[id].desc}</small></div>${votes[id] ? `<span class="votes">🗳 ${votes[id]}</span>` : ''}</button>`).join('')}</div>
        <div class="lbl">Bạn muốn làm</div>
        <div class="seg">${[['h', '🫥 Trốn'], ['any', '🎲 Ngẫu nhiên'], ['s', '🔫 Tìm']].map(([v, t]) => `<button data-pf="${v}" class="${me.pf === v ? 'on' : ''}">${t}</button>`).join('')}</div>
        <div class="lbl">Chế độ ${host ? '(chủ phòng chọn)' : ''}</div>
        <div class="seg">${[['classic', '🎯 Cổ điển', 'Bị bắt thì ra ngoài xem'], ['infect', '🦠 Lây nhiễm', 'Bị bắt thì thành người tìm']].map(([v, t, s]) => `<button data-mode="${v}" class="${R.mode === v ? 'on' : ''}" ${host ? '' : 'disabled'}>${t}<small>${s}</small></button>`).join('')}
          ${host ? `<button id="botTg" class="${R.bots ? 'on' : ''}">🤖 Bot cho đủ 5 người: ${R.bots ? 'BẬT' : 'TẮT'}</button>` : ''}</div>
        <div class="lbl">Trong phòng (${hs.length})</div>
        <div class="plist">${hs.map((p) => `<span class="${p === me ? 'me' : ''}">${p.u === hostId() ? '👑 ' : ''}${esc(p.n)}${p === me ? ' (bạn)' : ''}${p.vt ? ' · ' + MAPS[p.vt].icon : ''}</span>`).join('')}${R.bots && hs.length < 5 ? `<span>🤖 +${5 - hs.length} bot</span>` : ''}</div>
        <div class="foot">
          <span class="note" id="lobNote">${R.auto ? `⏱ Tự bắt đầu sau <b>${Math.ceil((R.auto - Date.now()) / 1000)}</b> giây` : host ? (total >= 2 ? 'Sẵn sàng thì bấm Bắt đầu' : 'Cần thêm người hoặc bật bot') : 'Chờ chủ phòng 👑 bắt đầu…'}</span>
          <button class="cbtn" id="walkBtn">🚶 Đi dạo</button>
          ${host ? `<button class="cbtn pri" id="startBtn" ${total >= 2 ? '' : 'disabled'}>▶ Bắt đầu</button>` : ''}
        </div>`;
      const L = $('lobbyCard');
      L.querySelectorAll('[data-map]').forEach((b) => { b.onclick = () => { me.vt = b.dataset.map; setMap(me.vt); placeInLobby(me); lobbySig = ''; renderLobby(); }; });
      L.querySelectorAll('[data-pf]').forEach((b) => { b.onclick = () => { me.pf = b.dataset.pf; lobbySig = ''; renderLobby(); }; });
      L.querySelectorAll('[data-mode]').forEach((b) => { b.onclick = () => { if (!isHost()) return; R.mode = b.dataset.mode; net(roundMsg()); lobbySig = ''; renderLobby(); }; });
      const bt = $('botTg'); if (bt) bt.onclick = () => { R.bots = !R.bots; net(roundMsg()); lobbySig = ''; renderLobby(); };
      const sb = $('startBtn'); if (sb) sb.onclick = () => startRound();
      const mk = $('mkRoom'); if (mk) mk.onclick = () => { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c = ''; for (let i = 0; i < 5; i++) c += A[rand(A.length)]; joinRoom(c); invOpen = true; if (EMBED) parent.postMessage({ type: 'hide-friends' }, '*'); };
      const pr = $('pubRoom'); if (pr) pr.onclick = () => joinRoom('');
      $('invBtn').onclick = () => { invOpen = !invOpen; if (invOpen && EMBED) { invData = null; parent.postMessage({ type: 'hide-friends' }, '*'); } lobbySig = ''; renderLobby(); };
      const ri = $('roomIn'); ri.oninput = () => { roomTyped = cleanRoom(ri.value); };
      ri.onkeydown = (e) => { if (e.key === 'Enter') $('roomGo').click(); };
      $('roomGo').onclick = () => { if (cleanRoom(roomTyped).length < 3) { toast('Mã phòng gồm 3–6 chữ / số'); return; } joinRoom(roomTyped); roomTyped = ''; };
      L.querySelectorAll('[data-inv-u]').forEach((b) => { b.onclick = () => sendInvite(b.dataset.invU, ''); });
      L.querySelectorAll('[data-inv-p]').forEach((b) => { b.onclick = () => sendInvite('', b.dataset.invP); });
      $('walkBtn').onclick = () => { $('ovLobby').classList.remove('show'); ui(); };
    }
    function showEnd() {
      const win = R.win, mine = myRoundRole;
      const ent = Object.keys(R.names || {}).map((u) => ({ u, n: nameOf(u), r: R.roles[u], c: R.catches[u] || 0, caught: !!R.caught[u] }));
      const iWon = mine && ((win === 's') === (mine === 's'));
      $('endCard').innerHTML = `
        <div class="win">${win === 's' ? '🔫 NGƯỜI TÌM THẮNG' : '🫥 NGƯỜI TRỐN THẮNG'}</div>
        <div class="sub" style="text-align:center">${mine ? (iWon ? '🎉 Phe bạn thắng!' : '😅 Phe bạn thua rồi') : 'Ván sau bạn sẽ được vào chơi'}${R.myCoins != null && mine ? ` · <b style="color:#fde047">+${R.myCoins} xu</b>` : ''} · ${MAP.icon} ${MAP.name}</div>
        <table class="res">${ent.sort((a, b) => b.c - a.c).map((e) => `<tr><td>${e.caught ? '💦' : e.r === 's' ? '🔫' : '🫥'} ${esc(e.n)}${e.u === ME ? ' (bạn)' : ''}</td><td>${e.caught ? 'bị bắt' : e.r === 's' ? '' : 'sống sót'}${e.c ? ` · bắt ${e.c}` : ''}</td></tr>`).join('')}</table>
        <div class="foot"><span class="note">Ván mới sau vài giây…</span><button class="cbtn" id="endClose">Đóng</button></div>`;
      $('endClose').onclick = () => $('ovEnd').classList.remove('show');
      $('ovEnd').classList.add('show'); R.myCoins = null;
    }

    /* ================= Vòng lặp ================= */
    let last = 0;
    function loop(t) { const dt = Math.min(0.05, (t - (last || t)) / 1000); last = t; update(dt); render(); requestAnimationFrame(loop); }
    let lastHidden = performance.now();
    setInterval(() => { if (!document.hidden) { lastHidden = performance.now(); return; } const n = performance.now(); update(Math.min(0.25, (n - lastHidden) / 1000)); lastHidden = n; }, 100);
    addEventListener('pagehide', () => net({ k: 'bye' }));
    if (Q.has('debug')) window.__TKH = { me, peers, bots, R: () => R, hostSet, setMap, camoScore, MAPS, SEEK_MS, startRound, joinRoom, enterPaint, exitPaint, shootAt, camera, CAM, bgAt, paintAt, dropAt, setColor };

    setMap('mansion'); placeInLobby(me);
    $('loading').remove();
    showLobby();
    net({ k: 'st', u: ME, n: MYNAME, x: +me.x.toFixed(2), z: +me.z.toFixed(2), h: 0, r: 'l', o: 0, mv: 0, pf: me.pf });
    requestAnimationFrame(loop);
    setInterval(ui, 400);
    makeThumbs();
  })();
  </script>
</body>
</html>
