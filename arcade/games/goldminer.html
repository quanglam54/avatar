<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Đào Vàng</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    #cv { width: 100%; max-width: 860px; height: auto; touch-action: manipulation; cursor: pointer; }
    #area .overlay { bottom: auto; min-height: 100%; }
    .gm-controls { display: flex; gap: 18px; align-items: center; justify-content: center; padding: 4px 0 2px; flex-wrap: wrap; }
    .gm-controls small { color: var(--muted); max-width: 300px; line-height: 1.45; }
    .dyn-btn {
      width: 96px; height: 96px; border-radius: 50%; border: 6px solid #2b1a10; cursor: pointer; flex: none;
      background: radial-gradient(circle at 40% 35%, #ff8787, #e03131 55%, #a61e1e); color: #fff;
      font: 900 30px/1 "Be Vietnam Pro", system-ui; box-shadow: 0 7px 0 #2b1a10, 0 0 0 7px #ced4da;
      display: grid; place-items: center; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none;
    }
    .dyn-btn span { display: block; font-size: 17px; text-shadow: 0 2px 0 #7a0e0e; margin-top: 2px; }
    .dyn-btn:disabled { filter: grayscale(1); opacity: .45; cursor: default; }
    .dyn-btn:not(:disabled):active, .dyn-btn.hit { transform: translateY(5px); box-shadow: 0 2px 0 #2b1a10, 0 0 0 7px #ced4da; }
    .dyn-btn.ready { animation: dynPulse .7s infinite alternate; }
    @keyframes dynPulse { to { box-shadow: 0 7px 0 #2b1a10, 0 0 0 7px #ffd43b, 0 0 24px 10px rgba(255, 212, 59, .55); } }
    .shop { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; margin: 0 auto 16px; max-width: 660px; }
    .shop .item {
      display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 12px 8px;
      border-radius: 16px; border: 2px solid var(--line); background: var(--card-2); text-align: center; transition: transform .12s, border-color .12s;
    }
    .shop .item:not(:disabled):hover { transform: translateY(-3px); border-color: #f59f00; }
    .shop .item .ic { font-size: 34px; line-height: 1.1; }
    .shop .item b { font-size: 14px; }
    .shop .item small { color: var(--muted); font-size: 11.5px; line-height: 1.35; }
    .shop .item .price { font-weight: 800; color: #f59f00; font-size: 16px; margin-top: 2px; }
    .shop .item.sold { border-color: var(--good); opacity: .6; }
    .shop .item.sold .price { color: var(--good); }
    .shop .item.poor { opacity: .45; }
    .shop .item:disabled { cursor: default; }
    .shop-head { margin: 0 0 12px !important; }
    @media (max-width: 520px) {
      .dyn-btn { width: 78px; height: 78px; font-size: 24px; }
      .shop .item { padding: 8px 6px; }
      .shop .item .ic { font-size: 26px; }
    }
  </style>
</head>
<body>
  <main class="game-layout">
    <section class="stage">
      <div class="hud">
        <div>Tiền<b id="money">$0</b></div>
        <div>Mục tiêu<b id="goal">$650</b></div>
        <div>Thời gian<b id="time">60</b></div>
        <div>Màn<b id="level">1</b></div>
        <div>Kỷ lục<b data-best>—</b></div>
      </div>
      <div class="play-area" id="area"><canvas id="cv" width="860" height="560"></canvas></div>
      <div class="gm-controls">
        <button class="dyn-btn" id="dynBtn" disabled>🧨<span id="dynCount">0</span></button>
        <small>Bấm vào màn chơi (hoặc phím <b>Space</b> / <b>↓</b>) để <b>thả móc</b>. Móc phải vật nặng vô giá trị? Bấm <b>🧨</b> (hoặc phím <b>D</b> / <b>↑</b>) để cho nổ tung!</small>
      </div>
    </section>
    <aside class="side" id="side"></aside>
  </main>

  <script src="../assets/common.js"></script>
  <script>
    GH.initGame('goldminer');
    const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
    const area = document.getElementById('area'), dynBtn = document.getElementById('dynBtn');
    const W = cv.width, H = cv.height, TIME = 60, SURF = 120;
    const DRUM = { x: 430, y: 88 }, PIV = { x: 430, y: 104 };
    const REST = 24, OUT_SPEED = 560, EMPTY_SPEED = 780, PULL_BASE = 560;
    const GOALS = [650, 1195, 2010, 3024, 4313, 5737, 7476, 9208, 11240, 13281];
    const TYPES = {
      goldS: { r: 13, val: 50, wt: 1.8 },
      goldM: { r: 22, val: 100, wt: 3 },
      goldL: { r: 36, val: 250, wt: 5.6 },
      goldXL: { r: 50, val: 500, wt: 8.2 },
      rockS: { r: 17, val: 11, wt: 3.6 },
      rockL: { r: 29, val: 20, wt: 6.6 },
      diamond: { r: 11, val: 600, wt: 1.2 },
      bag: { r: 18, val: 0, wt: 1.6 },
      skull: { r: 14, val: 20, wt: 1.6 },
      bone: { r: 15, val: 7, wt: 1.4 },
      mole: { r: 16, val: 2, wt: 1.6 },
      moleD: { r: 16, val: 2, wt: 1.7 },
      tnt: { r: 18, val: 0, wt: 1 },
    };
    const MONEY_TARGET = { x: 92, y: 30 };

    let state = 'ready', level, money, shownMoney, goal, timeLeft, items, claw, floats, parts, msg, dyn;
    let buffs, nextBuffs, last = 0, reelAng = 0, swingPhase = 0, shake = 0, clearT = 0, lastTick = 0, now = 0;
    let bgCanvas = null;

    const rnd = (a, b) => a + Math.random() * (b - a);
    const rint = (a, b) => Math.floor(rnd(a, b + 1));
    const goalFor = (lv) => (lv <= GOALS.length ? GOALS[lv - 1] : GOALS[GOALS.length - 1] + (lv - GOALS.length) * 2300);
    const fmtMoney = (v) => '$' + Math.round(v).toLocaleString('vi-VN');

    /* ---------- Âm thanh ---------- */
    let actx = null;
    function audio() {
      try {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === 'suspended') actx.resume();
        return actx;
      } catch (e) { return null; }
    }
    function tone(freq, dur, type = 'sine', vol = 0.15, slide = 0, delay = 0) {
      try {
        const a = audio(); if (!a) return;
        const t0 = a.currentTime + delay;
        const o = a.createOscillator(), g = a.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t0);
        if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
        g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.03);
      } catch (e) { /* bỏ qua */ }
    }
    function noise(dur, vol = 0.4, cutoff = 900) {
      try {
        const a = audio(); if (!a) return;
        const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
        const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
        src.buffer = buf; f.type = 'lowpass'; f.frequency.value = cutoff; g.gain.value = vol;
        src.connect(f); f.connect(g); g.connect(a.destination); src.start();
      } catch (e) { /* bỏ qua */ }
    }
    const sfx = {
      launch: () => tone(260, 0.14, 'triangle', 0.07, 260),
      grab: () => { tone(170, 0.12, 'square', 0.08, -70); noise(0.08, 0.2, 2000); },
      ding: (big) => { tone(big ? 1568 : 1175, 0.14, 'sine', 0.14); tone(big ? 2093 : 1568, 0.25, 'sine', 0.11, 0, 0.08); },
      thud: () => tone(130, 0.18, 'triangle', 0.16, -60),
      boom: () => { noise(0.75, 0.6, 700); tone(95, 0.45, 'sawtooth', 0.16, -60); },
      win: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.22, 'triangle', 0.12, 0, i * 0.11)),
      lose: () => [523, 440, 349, 262].forEach((f, i) => tone(f, 0.28, 'triangle', 0.12, 0, i * 0.15)),
      tick: () => tone(1000, 0.05, 'square', 0.05),
      buy: () => { tone(988, 0.08, 'square', 0.06); tone(1319, 0.16, 'square', 0.06, 0, 0.07); },
      power: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'square', 0.06, 0, i * 0.06)),
    };

    /* ---------- Tạo màn ---------- */
    function makeShape(n, lo, hi) { return Array.from({ length: n }, () => rnd(lo, hi)); }
    function newItem(type, x, y) {
      const t = TYPES[type];
      const it = { type, r: t.r, val: t.val, wt: t.wt, x, y, seed: Math.random() * 100, rot: rnd(-0.4, 0.4) };
      it.shape = type.startsWith('rock') ? makeShape(10, 0.82, 1.05) : makeShape(9, 0.8, 1.06);
      if (type === 'mole' || type === 'moleD') {
        const span = rnd(160, 300);
        it.x0 = Math.max(24, x - span / 2); it.x1 = Math.min(W - 24, x + span / 2);
        it.vx = rnd(45, 80) * (Math.random() < 0.5 ? -1 : 1);
      }
      return it;
    }
    function overlaps(x, y, r) { return items.some((o) => Math.hypot(o.x - x, o.y - y) < o.r + r + 8); }
    function place(type, ymin, ymax) {
      const r = TYPES[type].r;
      const lo = Math.max(ymin, SURF + 48 + r), hi = Math.min(ymax, H - r - 6);
      for (let k = 0; k < 90; k++) {
        const x = rnd(r + 12, W - r - 12), y = rnd(lo, Math.max(lo, hi));
        if (Math.abs(x - PIV.x) < 40 && y < 210) continue;
        if (!overlaps(x, y, r)) { const it = newItem(type, x, y); items.push(it); return it; }
      }
      return null;
    }
    function estValue(it) {
      if (it.type === 'bag') return 220;
      if (it.type === 'moleD') return 600;
      return it.val;
    }
    function genLevel(lv) {
      items = [];
      const need = goalFor(lv) - (lv > 1 ? goalFor(lv - 1) : 0);
      const add = (type, n, ymin, ymax) => { for (let i = 0; i < n; i++) place(type, ymin, ymax); };
      if (lv >= 3 && Math.random() < 0.45 + lv * 0.06) add('goldXL', lv >= 7 ? 2 : 1, 420, H);
      add('goldL', Math.min(4, 1 + Math.floor(lv / 2)), 340, H);
      add('rockL', Math.min(4, 1 + rint(0, 1) + Math.floor(lv / 3)), 230, 520);
      if (lv >= 4) add('tnt', rint(1, 2), 250, 520);
      add('goldM', 2 + rint(0, 2), 230, 520);
      add('rockS', 2 + rint(0, 2), 180, 480);
      if (lv >= 2) add('diamond', Math.min(5, lv - 1 + rint(0, 1)), 330, H);
      add('bag', 1 + rint(0, 2), 190, 540);
      add('goldS', 3 + rint(0, 2), 180, 460);
      if (lv >= 2) { add('skull', rint(0, 1) + (lv >= 4 ? 1 : 0), 200, 540); add('bone', rint(1, 2), 200, 540); }
      if (lv >= 3) {
        const n = Math.min(4, lv - 2);
        for (let i = 0; i < n; i++) {
          const y = rnd(210, 520), x = rnd(120, W - 120);
          items.push(newItem(Math.random() < 0.35 + lv * 0.05 ? 'moleD' : 'mole', x, y));
        }
      }
      let total = items.reduce((s, it) => s + estValue(it), 0), guard = 0;
      while (total < need * 1.9 && guard++ < 40) {
        const pick = lv >= 2 && Math.random() < 0.45 ? 'diamond' : (Math.random() < 0.6 ? 'goldL' : 'goldM');
        const it = place(pick, pick === 'goldM' ? 240 : 320, H);
        if (it) total += estValue(it);
      }
    }

    /* ---------- Vòng chơi ---------- */
    function resetClaw() { claw = { st: 'swing', ang: 0, len: REST, item: null, open: 1 }; }
    function setupLevel() {
      goal = goalFor(level); timeLeft = TIME; lastTick = 0;
      genLevel(level); resetClaw(); floats = []; parts = []; swingPhase = 0;
    }
    function start() {
      area.querySelectorAll('.overlay').forEach((o) => o.remove());
      level = 1; money = 0; shownMoney = 0; dyn = 0; buffs = {}; nextBuffs = {};
      setupLevel();
      state = 'play';
      msg = { text: 'Màn 1 · Mục tiêu ' + fmtMoney(goal), t: 1.8, color: '#ffd43b' };
      audio(); updateDyn(); hud();
    }
    function nextLevel() {
      area.querySelectorAll('.overlay').forEach((o) => o.remove());
      level++; buffs = nextBuffs; nextBuffs = {};
      setupLevel();
      state = 'play';
      msg = { text: 'Màn ' + level + ' · Mục tiêu ' + fmtMoney(goal), t: 1.8, color: '#ffd43b' };
      updateDyn(); hud();
    }

    const hudCache = {};
    function setText(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; document.getElementById(id).textContent = v; } }
    function hud() {
      setText('money', fmtMoney(money));
      setText('goal', fmtMoney(goal));
      setText('time', String(Math.ceil(Math.max(0, timeLeft))));
      setText('level', String(level));
    }
    function updateDyn() {
      document.getElementById('dynCount').textContent = dyn;
      const usable = state === 'play' && dyn > 0 && claw && claw.st === 'back' && !!claw.item;
      dynBtn.disabled = dyn <= 0 || state !== 'play';
      dynBtn.classList.toggle('ready', usable);
    }

    const dirOf = (a) => ({ x: Math.sin(a), y: Math.cos(a) });
    function clawPos() { const d = dirOf(claw.ang); return { x: PIV.x + d.x * claw.len, y: PIV.y + d.y * claw.len }; }
    function heldPos() {
      const d = dirOf(claw.ang), p = clawPos(), off = 12 + claw.item.r * 0.85;
      return { x: p.x + d.x * off, y: p.y + d.y * off };
    }

    function press() {
      if (state === 'ready') return start();
      if (state !== 'play' || claw.st !== 'swing') return;
      claw.st = 'out'; sfx.launch();
    }

    function useDynamite() {
      if (state !== 'play' || dyn <= 0 || claw.st !== 'back' || !claw.item) return;
      dyn--;
      const p = heldPos();
      explode(p.x, p.y, claw.item);
      claw.item = null;
      msg = { text: 'BÙM! 💥', t: 0.9, color: '#ff922b' };
      dynBtn.classList.add('hit'); setTimeout(() => dynBtn.classList.remove('hit'), 80);
      updateDyn();
    }

    function debrisColor(it) {
      if (!it) return '#ffa94d';
      if (it.type.startsWith('gold')) return '#fcc419';
      if (it.type.startsWith('rock')) return '#868e96';
      if (it.type === 'diamond') return '#a5d8ff';
      if (it.type === 'bag') return '#c08a4a';
      if (it.type.startsWith('mole')) return '#8d5a3b';
      return '#f1f3f5';
    }
    function explode(x, y, it, big) {
      const n = big ? 60 : 36, col = debrisColor(it);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, s = rnd(60, big ? 420 : 300);
        const fire = Math.random() < 0.6;
        parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: rnd(0.4, 0.9), max: 0.9, r: rnd(2, big ? 7 : 5), col: fire ? ['#ffe066', '#ff922b', '#f03e3e', '#fff'][rint(0, 3)] : col, g: fire ? 80 : 600 });
      }
      parts.push({ x, y, vx: 0, vy: 0, life: 0.35, max: 0.35, r: big ? 110 : 60, col: 'flash', g: 0 });
      shake = Math.max(shake, big ? 0.55 : 0.35);
      sfx.boom();
    }

    function bagReward(x, y) {
      const r = Math.random(), lucky = !!buffs.clover;
      if (r < 0.1) {
        buffs.strength = true; sfx.power();
        floats.push(mkFloat('💪 Tăng lực!', '#69db7c', x, y, false));
        return 0;
      }
      if (r < 0.2) {
        dyn++; sfx.power(); updateDyn();
        floats.push(mkFloat('+1 🧨', '#ff8787', x, y, false));
        return 0;
      }
      return Math.round(lucky ? rnd(300, 900) : 15 + Math.pow(Math.random(), 1.5) * 560);
    }

    function mkFloat(text, color, x, y, fly) { return { text, color, x0: x, y0: y, t: 0, dur: fly ? 1.0 : 1.3, fly }; }

    function collect() {
      const it = claw.item;
      resetClaw();
      claw.ang = Math.sin(swingPhase) * 1.3;
      if (!it) return;
      const x = PIV.x + 40, y = PIV.y + 10;
      let v = it.val;
      if (it.type.startsWith('rock') && buffs.rockBook) v *= 3;
      if (it.type === 'diamond') v = buffs.diamondBook ? 900 : 600;
      if (it.type === 'moleD') v = 2 + (buffs.diamondBook ? 900 : 600);
      if (it.type === 'bag') v = bagReward(x, y);
      if (v > 0) {
        money += v;
        const precious = v >= 250;
        floats.push(mkFloat('+' + fmtMoney(v), precious ? '#ffd43b' : '#fff', x, y, true));
        if (v >= 50) sfx.ding(precious); else sfx.thud();
      }
      hud(); updateDyn();
    }

    function endLevel() {
      if (claw.item) claw.item = null;
      resetClaw();
      if (money >= goal) {
        state = 'clear'; clearT = 1.8; sfx.win();
        msg = { text: '🎉 Đạt mục tiêu! Qua màn!', t: 1.8, color: '#69db7c' };
      } else {
        state = 'over'; sfx.lose();
        msg = null; updateDyn(); hud();
        GH.gameOver(area, 'goldminer', money, { title: '💸 Không đủ tiền mục tiêu!', note: `Dừng ở màn ${level} · cần ${fmtMoney(goal)}` }, start);
      }
      updateDyn();
    }

    /* ---------- Cửa hàng ---------- */
    function showShop() {
      state = 'shop';
      const L = level;
      const all = [
        { id: 'dyn', ic: '🧨', name: 'Thuốc nổ', desc: 'Phá vật đang móc để kéo về nhanh (bấm 🧨 / phím D)', price: rint(10, 80) + L * 12 },
        { id: 'strength', ic: '💪', name: 'Thuốc tăng lực', desc: 'Màn sau kéo nhanh gấp rưỡi', price: rint(100, 300) + L * 25 },
        { id: 'clover', ic: '🍀', name: 'Cỏ bốn lá', desc: 'Màn sau túi bí ẩn chứa nhiều tiền hơn', price: rint(20, 120) + L * 15 },
        { id: 'diamondBook', ic: '💎', name: 'Sách đá quý', desc: 'Màn sau kim cương giá $900 thay vì $600', price: rint(100, 400) + L * 20 },
        { id: 'rockBook', ic: '🪨', name: 'Sách sưu tầm đá', desc: 'Màn sau đá có giá gấp 3', price: rint(5, 60) + L * 6 },
      ];
      const offers = all.filter(() => Math.random() < 0.65);
      while (offers.length < 2) { const o = all[rint(0, all.length - 1)]; if (!offers.includes(o)) offers.push(o); }
      offers.sort((a, b) => all.indexOf(a) - all.indexOf(b));
      const html = `<h2>🛒 Cửa hàng</h2>
        <p class="shop-head">Tiền của bạn: <b id="shopMoney" style="color:#f59f00">${fmtMoney(money)}</b> · Màn ${L + 1} cần <b>${fmtMoney(goalFor(L + 1))}</b><br><small>Tiền mua đồ sẽ bị trừ vào điểm.</small></p>
        <div class="shop">${offers.map((o, i) => `<button class="item" data-i="${i}"><span class="ic">${o.ic}</span><b>${o.name}</b><small>${o.desc}</small><span class="price">${fmtMoney(o.price)}</span></button>`).join('')}</div>`;
      GH.overlay(area, html, 'Màn tiếp theo ▶', nextLevel);
      const ov = area.querySelector('.overlay');
      const refresh = () => {
        ov.querySelector('#shopMoney').textContent = fmtMoney(money);
        ov.querySelectorAll('.item').forEach((b) => {
          const o = offers[+b.dataset.i];
          if (b.classList.contains('sold')) return;
          b.classList.toggle('poor', money < o.price);
          b.disabled = money < o.price;
        });
        hud();
      };
      ov.querySelectorAll('.item').forEach((b) => {
        b.onclick = (e) => {
          e.stopPropagation();
          const o = offers[+b.dataset.i];
          if (b.classList.contains('sold') || money < o.price) return;
          money -= o.price; shownMoney = money;
          if (o.id === 'dyn') dyn++; else nextBuffs[o.id] = true;
          b.classList.add('sold'); b.disabled = true;
          b.querySelector('.price').textContent = '✓ Đã mua';
          sfx.buy(); refresh(); updateDyn();
        };
      });
      refresh();
    }

    /* ---------- Cập nhật ---------- */
    function update(dt) {
      now += dt;
      floats.forEach((f) => { f.t += dt; });
      floats = floats.filter((f) => f.t < f.dur);
      parts.forEach((p) => { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vx *= 0.98; });
      parts = parts.filter((p) => p.life > 0);
      if (msg) { msg.t -= dt; if (msg.t <= 0) msg = null; }
      shake = Math.max(0, shake - dt);
      shownMoney += (money - shownMoney) * Math.min(1, dt * 8);
      if (Math.abs(money - shownMoney) < 1) shownMoney = money;

      items.forEach((it) => {
        if (it.vx) {
          it.x += it.vx * dt;
          if (it.x < it.x0) { it.x = it.x0; it.vx = Math.abs(it.vx); }
          if (it.x > it.x1) { it.x = it.x1; it.vx = -Math.abs(it.vx); }
        }
      });

      if (state === 'clear') { clearT -= dt; if (clearT <= 0) showShop(); return; }
      if (state === 'ready') { swingPhase += dt * 2.1; claw.ang = Math.sin(swingPhase) * 1.3; return; }
      if (state !== 'play') return;

      timeLeft -= dt;
      if (timeLeft <= 10 && Math.ceil(timeLeft) !== lastTick) { lastTick = Math.ceil(timeLeft); if (lastTick > 0) sfx.tick(); }
      if (timeLeft <= 0) { timeLeft = 0; hud(); return endLevel(); }

      ctx.fillStyle = '#7a4a1e'; ctx.beginPath(); ctx.ellipse(hx, hy - 10, 20, 5, -0.05, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8f5a2a'; ctx.beginPath(); ctx.roundRect(hx - 10, hy - 25, 21, 16, [8, 8, 2, 2]); ctx.fill();
      ctx.fillStyle = '#4a2a0e'; ctx.fillRect(hx - 10, hy - 14, 21, 4);
      ctx.restore();
      const sh = { x: bx + 2, y: by - 62 }, cp = crankPoint();
      const hand = pulling ? cp : { x: DRUM.x + 14, y: DRUM.y + 2 };
      const ex = (sh.x + hand.x) / 2 + 2, ey = Math.max(sh.y, hand.y) + 8;
      ctx.strokeStyle = '#e03131'; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.strokeStyle = '#ffd8b5'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(hand.x, hand.y); ctx.stroke();
      ctx.strokeStyle = '#3d1f05'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(DRUM.x, DRUM.y); ctx.lineTo(cp.x, cp.y); ctx.stroke();
      circle(cp.x, cp.y, 3.5, '#212529');
      circle(hand.x, hand.y, 4, '#ffd8b5');
      for (let i = 0; i < Math.min(dyn, 6); i++) {
        const dx = bx + 46 + (i % 3) * 9, dy = by - 26 - Math.floor(i / 3) * 6;
        ctx.save(); ctx.translate(dx, dy); ctx.rotate(0.1);
        ctx.fillStyle = '#e03131'; ctx.fillRect(-3, 0, 6, 22); ctx.fillStyle = '#fff'; ctx.fillRect(-3, 8, 6, 3);
        ctx.strokeStyle = '#495057'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(2, -5); ctx.stroke();
        ctx.restore();
      }
      if (dyn > 6) { ctx.fillStyle = '#5c3209'; ctx.font = '900 13px "Be Vietnam Pro", system-ui'; ctx.textAlign = 'left'; ctx.fillText('x' + dyn, bx + 76, by - 18); }
    }

    function drawClaw() {
      const p = clawPos(), d = dirOf(claw.ang);
      ctx.strokeStyle = '#2b1a10'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(PIV.x, PIV.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(PIV.x + 1, PIV.y); ctx.lineTo(p.x + 1, p.y); ctx.stroke();
      if (claw.item) drawItem(claw.item, true);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(-claw.ang);
      const open = 0.25 + claw.open * 0.55;
      [-1, 1].forEach((s) => {
        ctx.save(); ctx.rotate(s * open);
        ctx.strokeStyle = '#495057'; ctx.lineWidth = 5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(0, 2); ctx.quadraticCurveTo(s * 13, 10, s * 7, 22); ctx.stroke();
        ctx.strokeStyle = '#adb5bd'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, 2); ctx.quadraticCurveTo(s * 13, 10, s * 7, 22); ctx.stroke();
        ctx.restore();
      });
      ctx.fillStyle = '#343a40'; ctx.beginPath(); ctx.roundRect(-7, -6, 14, 10, 3); ctx.fill();
      circle(0, 0, 3, '#ced4da');
      ctx.restore();
      if (state === 'play' && claw.st === 'swing') {
        ctx.setLineDash([4, 10]); ctx.strokeStyle = 'rgba(255,240,200,.25)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p.x + d.x * 24, p.y + d.y * 24); ctx.lineTo(p.x + d.x * 140, p.y + d.y * 140); ctx.stroke(); ctx.setLineDash([]);
      }
    }

    function panel(x, y, w, h) { ctx.fillStyle = 'rgba(43,26,16,.78)'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.fill(); ctx.strokeStyle = 'rgba(255,212,59,.5)'; ctx.lineWidth = 2; ctx.stroke(); }
    function drawCanvasHud() {
      panel(10, 8, 200, 58);
      ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      ctx.font = '700 12px "Be Vietnam Pro", system-ui'; ctx.fillStyle = '#ffe8a3';
      ctx.fillText('Tiền', 22, 23); ctx.fillText('Mục tiêu', 22, 50);
      ctx.textAlign = 'right'; ctx.font = '900 20px "Be Vietnam Pro", system-ui';
      ctx.fillStyle = shownMoney >= goal ? '#69db7c' : '#ffd43b'; ctx.fillText(fmtMoney(shownMoney), 198, 24);
      ctx.font = '800 15px "Be Vietnam Pro", system-ui'; ctx.fillStyle = '#fff'; ctx.fillText(fmtMoney(goal), 198, 50);
      panel(W - 150, 8, 140, 58);
      ctx.textAlign = 'left'; ctx.font = '900 20px "Be Vietnam Pro", system-ui';
      ctx.fillStyle = timeLeft <= 10 && state === 'play' && Math.sin(now * 10) > 0 ? '#ff6b6b' : '#fff';
      ctx.fillText('⏱ ' + Math.ceil(Math.max(0, timeLeft)) + 's', W - 138, 25);
      ctx.font = '800 14px "Be Vietnam Pro", system-ui'; ctx.fillStyle = '#ffe8a3'; ctx.fillText('Màn ' + level, W - 138, 50);
      const icons = [buffs.strength && '💪', buffs.clover && '🍀', buffs.diamondBook && '💎', buffs.rockBook && '🪨'].filter(Boolean);
      if (icons.length) { ctx.font = '16px system-ui, "Segoe UI Emoji"'; ctx.textAlign = 'right'; ctx.fillText(icons.join(''), W - 18, 50); }
    }

    function draw() {
      ctx.save();
      if (shake > 0) ctx.translate(rnd(-1, 1) * shake * 16, rnd(-1, 1) * shake * 16);
      if (!bgCanvas) buildBackground();
      ctx.drawImage(bgCanvas, 0, 0);
      items.forEach((it) => drawItem(it, false));
      drawWinch();
      drawClaw();
      drawMiner();
      parts.forEach((p) => {
        if (p.col === 'flash') {
          const k = p.life / p.max;
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * (1.4 - k * 0.6));
          g.addColorStop(0, `rgba(255,250,220,${k})`); g.addColorStop(0.4, `rgba(255,170,60,${k * 0.8})`); g.addColorStop(1, 'rgba(255,100,0,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 1.4, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * 1.5));
          circle(p.x, p.y, p.r, p.col);
          ctx.globalAlpha = 1;
        }
      });
      ctx.restore();
      drawCanvasHud();
      floats.forEach((f) => {
        const k = f.t / f.dur;
        let x = f.x0, y = f.y0 - 30 * Math.min(1, k * 4), s = 1 + Math.max(0, 0.4 - k) * 1.2;
        if (f.fly && k > 0.3) {
          const q = (k - 0.3) / 0.7, e = q * q * (3 - 2 * q);
          x = f.x0 + (MONEY_TARGET.x - f.x0) * e;
          y = f.y0 - 30 + (MONEY_TARGET.y - (f.y0 - 30)) * e - Math.sin(e * Math.PI) * 50;
          s = 1 - e * 0.45;
        }
        ctx.globalAlpha = f.fly ? 1 - Math.max(0, k - 0.9) * 10 : Math.min(1, (1 - k) * 3);
        ctx.font = `900 ${Math.round(28 * s)}px "Be Vietnam Pro", system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(43,26,16,.85)'; ctx.strokeText(f.text, x, y);
        ctx.fillStyle = f.color; ctx.fillText(f.text, x, y);
        ctx.globalAlpha = 1;
      });
      if (msg) {
        ctx.globalAlpha = Math.min(1, msg.t * 2);
        ctx.font = '900 30px "Be Vietnam Pro", system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 7; ctx.strokeStyle = '#2b1a10'; ctx.strokeText(msg.text, W / 2, 300);
        ctx.fillStyle = msg.color; ctx.fillText(msg.text, W / 2, 300);
        ctx.globalAlpha = 1;
      }
    }

    function loop(t) {
      const dt = Math.min(0.05, Math.max(0, (t - (last || t)) / 1000));
      last = t;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    cv.addEventListener('pointerdown', (e) => { e.preventDefault(); press(); });
    dynBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); useDynamite(); });
    document.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowDown') {
        if (state === 'shop' || state === 'over') return;
        e.preventDefault(); press();
      } else if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowUp') {
        e.preventDefault(); useDynamite();
      }
    });

    level = 1; money = 0; shownMoney = 0; dyn = 0; buffs = {}; nextBuffs = {}; msg = null;
    setupLevel(); hud(); updateDyn();
    requestAnimationFrame(loop);
    GH.overlay(area, '<h2>⛏️ Đào Vàng</h2><p>Móc câu tự lắc qua lại — bấm vào màn chơi (hoặc <b>Space</b>) để <b>thả móc</b>.<br>Vàng to đáng tiền nhưng kéo chậm, đá thì rẻ. Kim cương nhẹ mà giá cao!<br>Gom đủ <b>tiền mục tiêu</b> trong 60 giây để qua màn và ghé <b>cửa hàng</b>.</p>', 'Bắt đầu', start);
  </script>
</body>
</html>
