<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đào Vàng</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
  <style>#cv { width: 100%; max-width: 820px; height: auto; cursor: pointer; }</style>
</head>
<body>
  <main class="game-layout">
    <section class="stage">
      <div class="hud">
        <div>Điểm<b id="score">0</b></div>
        <div>Mục tiêu<b id="goal">0</b></div>
        <div>Màn<b id="level">1</b></div>
        <div>Thời gian<b id="time">60</b></div>
        <div>Kỷ lục<b data-best>—</b></div>
      </div>
      <div class="play-area" id="area"><canvas id="cv" width="820" height="540"></canvas></div>
    </section>
    <aside class="side" id="side"></aside>
  </main>

  <script src="../assets/common.js"></script>
  <script>
    GH.initGame('goldminer');
    const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
    const area = document.getElementById('area');
    const W = cv.width, H = cv.height, PIV = { x: W / 2, y: 92 }, GROUND = 130;
    const KINDS = {
      goldS: { r: 16, value: 60, weight: 1.3, color: '#ffd43b' },
      goldM: { r: 26, value: 160, weight: 2.2, color: '#fcc419' },
      goldL: { r: 42, value: 420, weight: 4.2, color: '#fab005' },
      rockS: { r: 20, value: 15, weight: 2.4, color: '#868e96' },
      rockL: { r: 34, value: 30, weight: 4.6, color: '#6c757d' },
      gem: { r: 12, value: 600, weight: 0.8, color: '#74c0fc' },
      bag: { r: 18, value: 0, weight: 1.2, color: '#c98a4b' },
    };
    let items, score, total, level, goal, timeLeft, hook, state = 'ready', last = 0, msg = null;

    function rand(a, b) { return a + Math.random() * (b - a); }

    function makeLevel() {
      items = [];
      const plan = { goldL: 1 + Math.floor(level / 2), goldM: 3 + level, goldS: 4, rockL: 2 + Math.floor(level / 2), rockS: 3, gem: level >= 2 ? 1 + Math.floor(level / 3) : 0, bag: 2 };
      for (const [k, n] of Object.entries(plan)) {
        for (let i = 0; i < n; i++) {
          const r = KINDS[k].r;
          for (let tries = 0; tries < 60; tries++) {
            const x = rand(40 + r, W - 40 - r), y = rand(GROUND + 70 + r, H - 20 - r);
            if (items.every((o) => Math.hypot(o.x - x, o.y - y) > o.r + r + 8)) { items.push({ k, x, y, r }); break; }
          }
        }
      }
      score = 0;
      goal = 300 + level * 350 + (level - 1) * level * 60;
      timeLeft = 60;
      hook = { a: 0, dir: 1, len: 40, state: 'swing', item: null };
      hud();
    }

    function hud() {
      document.getElementById('score').textContent = (total + score).toLocaleString('vi-VN');
      document.getElementById('goal').textContent = (total + goal).toLocaleString('vi-VN');
      document.getElementById('level').textContent = level;
      document.getElementById('time').textContent = Math.ceil(timeLeft);
    }

    function start() {
      area.querySelectorAll('.overlay').forEach((o) => o.remove());
      total = 0; level = 1;
      makeLevel();
      state = 'play';
    }

    function shoot() {
      if (state === 'ready') return start();
      if (state === 'play' && hook.state === 'swing') hook.state = 'out';
    }

    function endLevel() {
      if (score >= goal) {
        total += score;
        state = 'between';
        GH.overlay(area, `<h2>🎉 Qua màn ${level}!</h2><p>Bạn được ${score.toLocaleString('vi-VN')} điểm ở màn này.</p>`, 'Màn tiếp theo ▶', () => { level++; makeLevel(); state = 'play'; });
      } else {
        state = 'over';
        GH.gameOver(area, 'goldminer', total + score, { title: '⏰ Hết giờ!', note: `Thiếu ${(goal - score).toLocaleString('vi-VN')} điểm để qua màn ${level}` }, start);
      }
    }

    function update(dt) {
      if (state !== 'play') return;
      timeLeft -= dt;
      if (timeLeft <= 0) { timeLeft = 0; hud(); endLevel(); return; }
      const h = hook;
      if (h.state === 'swing') {
        h.a += h.dir * dt * 1.6;
        if (h.a > 1.25) { h.a = 1.25; h.dir = -1; }
        if (h.a < -1.25) { h.a = -1.25; h.dir = 1; }
      } else if (h.state === 'out') {
        h.len += 520 * dt;
        const tx = PIV.x + Math.sin(h.a) * h.len, ty = PIV.y + Math.cos(h.a) * h.len;
        const hit = items.find((o) => Math.hypot(o.x - tx, o.y - ty) < o.r + 6);
        if (hit) { h.item = hit; h.state = 'back'; items.splice(items.indexOf(hit), 1); }
        else if (tx < 0 || tx > W || ty > H) h.state = 'back';
      } else if (h.state === 'back') {
        const w = h.item ? KINDS[h.item.k].weight : 0.4;
        h.len -= (560 / w) * dt;
        if (h.item) { h.item.x = PIV.x + Math.sin(h.a) * (h.len + h.item.r); h.item.y = PIV.y + Math.cos(h.a) * (h.len + h.item.r); }
        if (h.len <= 40) {
          h.len = 40;
          if (h.item) {
            let v = KINDS[h.item.k].value;
            if (h.item.k === 'bag') v = [50, 120, 250, 500, 30][Math.floor(Math.random() * 5)];
            score += v;
            msg = { text: `+${v}`, t: 1.2, color: h.item.k === 'gem' ? '#74c0fc' : h.item.k.startsWith('rock') ? '#ced4da' : '#ffd43b' };
            hud();
          }
          h.item = null;
          h.state = 'swing';
          if (!items.some((o) => KINDS[o.k].value > 0 || o.k === 'bag')) endLevel();
        }
      }
      if (msg) { msg.t -= dt; if (msg.t <= 0) msg = null; }
      hud();
    }

    function drawItem(o) {
      const K = KINDS[o.k];
      ctx.save(); ctx.translate(o.x, o.y);
      if (o.k.startsWith('gold')) {
        ctx.fillStyle = '#e8a800'; ctx.beginPath(); ctx.ellipse(2, 3, o.r, o.r * 0.82, 0.3, 0, 7); ctx.fill();
        ctx.fillStyle = K.color; ctx.beginPath(); ctx.ellipse(0, 0, o.r, o.r * 0.8, 0.3, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(-o.r * 0.3, -o.r * 0.3, o.r * 0.3, o.r * 0.18, -0.4, 0, 7); ctx.fill();
      } else if (o.k.startsWith('rock')) {
        ctx.fillStyle = '#495057'; ctx.beginPath(); ctx.ellipse(2, 3, o.r, o.r * 0.78, 0, 0, 7); ctx.fill();
        ctx.fillStyle = K.color; ctx.beginPath(); ctx.ellipse(0, 0, o.r, o.r * 0.75, 0, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.arc(o.r * 0.3, o.r * 0.1, o.r * 0.25, 0, 7); ctx.fill();
      } else if (o.k === 'gem') {
        ctx.fillStyle = K.color;
        ctx.beginPath(); ctx.moveTo(0, -o.r); ctx.lineTo(o.r, -o.r * 0.2); ctx.lineTo(0, o.r); ctx.lineTo(-o.r, -o.r * 0.2); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(0, -o.r); ctx.lineTo(o.r * 0.4, -o.r * 0.2); ctx.lineTo(-o.r * 0.4, -o.r * 0.2); ctx.closePath(); ctx.fill();
      } else {
        ctx.fillStyle = K.color; ctx.beginPath(); ctx.arc(0, 4, o.r, 0, 7); ctx.fill();
        ctx.fillStyle = '#8a4b22'; ctx.fillRect(-6, -o.r + 2, 12, 6);
        ctx.fillStyle = '#5c3214'; ctx.font = '900 16px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', 0, 6);
      }
      ctx.restore();
    }

    function draw() {
      const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
      sky.addColorStop(0, '#74c0fc'); sky.addColorStop(1, '#d0ebff');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, W, GROUND);
      const dirt = ctx.createLinearGradient(0, GROUND, 0, H);
      dirt.addColorStop(0, '#c98a4b'); dirt.addColorStop(1, '#6b3618');
      ctx.fillStyle = dirt; ctx.fillRect(0, GROUND, W, H - GROUND);
      ctx.fillStyle = '#40c057'; ctx.fillRect(0, GROUND - 8, W, 10);
      for (let i = 0; i < 40; i++) { ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.beginPath(); ctx.arc((i * 137) % W, GROUND + 30 + ((i * 71) % (H - GROUND - 40)), 6 + (i % 4) * 3, 0, 7); ctx.fill(); }
      // người đào vàng + tời
      ctx.fillStyle = '#8a4b22'; ctx.fillRect(PIV.x - 50, 60, 100, 20);
      ctx.fillStyle = '#495057'; ctx.beginPath(); ctx.arc(PIV.x, 70, 14, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffe0c4'; ctx.beginPath(); ctx.arc(PIV.x + 54, 30, 14, 0, 7); ctx.fill();
      ctx.fillStyle = '#f59f00'; ctx.beginPath(); ctx.arc(PIV.x + 54, 26, 15, Math.PI, 0); ctx.fill(); ctx.fillRect(PIV.x + 36, 24, 36, 4);
      ctx.fillStyle = '#1971c2'; ctx.fillRect(PIV.x + 44, 44, 20, 24);
      items.forEach(drawItem);
      // dây + móc
      const h = hook, tx = PIV.x + Math.sin(h.a) * h.len, ty = PIV.y + Math.cos(h.a) * h.len;
      ctx.strokeStyle = '#343a40'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(PIV.x, PIV.y - 20); ctx.lineTo(tx, ty); ctx.stroke();
      if (h.item) drawItem(h.item);
      ctx.save(); ctx.translate(tx, ty); ctx.rotate(-h.a);
      ctx.strokeStyle = '#495057'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-14, 6, -10, 16); ctx.moveTo(0, 0); ctx.quadraticCurveTo(14, 6, 10, 16); ctx.stroke();
      ctx.restore();
      if (msg) {
        ctx.globalAlpha = Math.min(1, msg.t);
        ctx.font = '900 34px "Be Vietnam Pro", system-ui'; ctx.textAlign = 'center';
        ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.strokeText(msg.text, PIV.x, 50 - (1.2 - msg.t) * 20);
        ctx.fillStyle = msg.color; ctx.fillText(msg.text, PIV.x, 50 - (1.2 - msg.t) * 20);
        ctx.globalAlpha = 1;
      }
    }

    function loop(t) {
      const dt = Math.min(0.05, (t - (last || t)) / 1000);
      last = t;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    cv.addEventListener('pointerdown', (e) => { e.preventDefault(); shoot(); });
    document.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); shoot(); } });

    total = 0; level = 1; makeLevel(); state = 'ready';
    requestAnimationFrame(loop);
    GH.overlay(area, '<h2>⛏️ Đào Vàng</h2><p>Chạm hoặc bấm Space để thả móc gắp vàng.<br>Đủ điểm mục tiêu trước khi hết 60 giây!</p>', 'Bắt đầu', start);
  </script>
</body>
</html>
