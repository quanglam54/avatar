<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pikachu</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    #cv { touch-action: manipulation; cursor: pointer; box-shadow: 0 10px 30px -12px rgba(0, 0, 0, .55); }
    .pk-title { display: flex; gap: 2px; font: 900 32px/1 "Be Vietnam Pro", system-ui; letter-spacing: 1px; user-select: none; }
    .pk-title span {
      display: inline-block; -webkit-text-stroke: 2px #1e3a8a; paint-order: stroke fill;
      text-shadow: 0 3px 0 #1e3a8a, 0 6px 10px rgba(0, 0, 0, .25); animation: pkBob 2.4s ease-in-out infinite;
    }
    .pk-title span:nth-child(1) { color: #ffd43b; animation-delay: 0s; }
    .pk-title span:nth-child(2) { color: #ff922b; animation-delay: .12s; }
    .pk-title span:nth-child(3) { color: #ff6b6b; animation-delay: .24s; }
    .pk-title span:nth-child(4) { color: #f783ac; animation-delay: .36s; }
    .pk-title span:nth-child(5) { color: #b197fc; animation-delay: .48s; }
    .pk-title span:nth-child(6) { color: #4dabf7; animation-delay: .6s; }
    .pk-title span:nth-child(7) { color: #69db7c; animation-delay: .72s; }
    .pk-title .bolt { -webkit-text-stroke: 0; text-shadow: none; margin-left: 4px; }
    @keyframes pkBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    .tbar {
      position: relative; width: 100%; height: 20px; border-radius: 999px;
      background: #1f2937; border: 2px solid #0b1220; overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, .5);
    }
    .tfill {
      height: 100%; width: 100%; border-radius: 999px;
      background: linear-gradient(180deg, #8ce99a, #2f9e44);
      box-shadow: inset 0 3px 0 rgba(255, 255, 255, .35);
    }
    .tbar span {
      position: absolute; inset: 0; text-align: center; font: 800 12px/16px "Be Vietnam Pro", system-ui;
      color: #fff; text-shadow: 0 1px 2px #000, 0 0 3px #000;
    }
    .pk-tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; width: 100%; }
    .tool {
      border: 0; border-radius: 12px; padding: 8px 14px; font-weight: 800; font-size: 14px;
      background: linear-gradient(#ffe066, #fab005); color: #5c3d00; box-shadow: 0 4px 0 #c77d00;
      touch-action: manipulation; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .tool:active { transform: translateY(3px); box-shadow: 0 1px 0 #c77d00; }
    .tool:disabled { filter: grayscale(1); opacity: .55; cursor: default; }
    .tool b { display: inline-block; min-width: 22px; background: #fff; border-radius: 999px; padding: 0 6px; margin-left: 4px; }
    .tool.blue { background: linear-gradient(#74c0fc, #339af0); color: #fff; box-shadow: 0 4px 0 #1864ab; }
    .tool.blue:active { box-shadow: 0 1px 0 #1864ab; }
    .tool.blue b { color: #1864ab; }
    .tool.mute { background: var(--card-2); color: var(--text); box-shadow: 0 4px 0 rgba(0, 0, 0, .25); border: 1px solid var(--line); }
    .mode-lbl { font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }
    @media (max-width: 520px) {
      .pk-title { font-size: 26px; }
      .tool { padding: 7px 10px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <main class="game-layout">
    <section class="stage">
      <div class="pk-title" aria-label="PIKACHU"><span>P</span><span>I</span><span>K</span><span>A</span><span>C</span><span>H</span><span>U</span><span class="bolt">⚡</span></div>
      <div class="hud">
        <div>Điểm<b id="score">0</b></div>
        <div>Màn<b id="level">1</b></div>
        <div>Còn lại<b id="left">144</b></div>
        <div>Kỷ lục<b data-best>—</b></div>
      </div>
      <div class="tbar" id="tbar"><div class="tfill" id="tfill"></div><span id="ttext">300 giây</span></div>
      <div class="pk-tools">
        <button class="tool" id="bHint" title="Gợi ý một cặp">💡 Gợi ý <b id="nHint">3</b></button>
        <button class="tool blue" id="bShuf" title="Đảo lại bàn">🔀 Đảo <b id="nShuf">3</b></button>
        <button class="tool mute" id="bMute" title="Bật/tắt âm thanh">🔊</button>
        <span class="mode-lbl" id="modeLbl"></span>
      </div>
      <div class="play-area" id="area"><canvas id="cv" width="900" height="560"></canvas></div>
    </section>
    <aside class="side" id="side"></aside>
  </main>

  <script src="../assets/common.js"></script>
  <script>
    GH.initGame('pikachu');
    const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
    const area = document.getElementById('area');
    const $ = (id) => document.getElementById(id);

    /* ---------- Dữ liệu ---------- */
    const ICONS = ['🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🐦', '🐤', '🦆',
      '🦉', '🐺', '🐗', '🐴', '🦄', '🐝', '🐛', '🦋', '🐌', '🐞', '🐢', '🐍', '🦖', '🐙', '🦑', '🦀', '🐠', '🐬'];
    const PASTEL = ICONS.map((_, i) => `hsl(${Math.round((i * 137.508) % 360)}, 85%, 86%)`);
    const MODES = [
      { id: 'none', name: 'Đứng yên', icon: '⏸️' },
      { id: 'down', name: 'Dồn xuống', icon: '⬇️' },
      { id: 'left', name: 'Dồn sang trái', icon: '⬅️' },
      { id: 'up', name: 'Dồn lên', icon: '⬆️' },
      { id: 'right', name: 'Dồn sang phải', icon: '➡️' },
      { id: 'cx', name: 'Dồn vào giữa (ngang)', icon: '↔️' },
      { id: 'cy', name: 'Dồn vào giữa (dọc)', icon: '↕️' },
    ];
    const modeFor = (lv) => (lv <= 1 ? MODES[0] : MODES[1 + ((lv - 2) % (MODES.length - 1))]);
    const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    const EMOJI_FONT = '"Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", "Twemoji Mozilla", sans-serif';

    let R = 9, C = 16, grid = [], tiles = [];
    let state = 'ready', score = 0, level = 1, mode = MODES[0];
    let timeLeft = 300, timeMax = 300, clock = 0, last = 0;
    let hints = 3, shuffles = 3, sel = null, hintPair = null, hintT = 0;
    let combo = 0, lastMatchAt = -99, lastTick = 0;
    let paths = [], ghosts = [], parts = [], floats = [], msg = null;
    let L = null, sprites = [], bgCanvas = null;
    let muted = !!GH.load('pk_mute', false);

    const rand = (n) => Math.floor(Math.random() * n);
    function shuffleArr(a) { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    /* ---------- Âm thanh (WebAudio) ---------- */
    let AC = null;
    function audio() {
      try {
        if (!AC) { const A = window.AudioContext || window.webkitAudioContext; if (A) AC = new A(); }
        if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
      } catch (e) { AC = null; }
      return AC;
    }
    function tone(f, d, type = 'sine', vol = 0.12, when = 0, f2 = 0) {
      if (muted) return;
      try {
        const a = audio(); if (!a) return;
        const t0 = a.currentTime + when;
        const o = a.createOscillator(), g = a.createGain();
        o.type = type; o.frequency.setValueAtTime(f, t0);
        if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
        o.connect(g); g.connect(a.destination);
        o.start(t0); o.stop(t0 + d + 0.03);
      } catch (e) { /* bỏ qua */ }
    }
    const sfx = {
      select: () => tone(660, 0.07, 'triangle', 0.08),
      match: (k) => { const b = 784 * Math.pow(1.06, Math.min(k, 8)); tone(b, 0.12, 'sine', 0.14); tone(b * 1.5, 0.22, 'sine', 0.11, 0.07); },
      wrong: () => { tone(160, 0.18, 'square', 0.06); tone(120, 0.2, 'square', 0.05, 0.08); },
      shuffle: () => tone(300, 0.35, 'triangle', 0.08, 0, 900),
      hint: () => { tone(988, 0.1, 'sine', 0.08); tone(1319, 0.14, 'sine', 0.07, 0.08); },
      tick: () => tone(1000, 0.05, 'square', 0.03),
      win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.11, i * 0.11)),
      lose: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.3, 'sawtooth', 0.05, i * 0.15)),
    };

    /* ---------- Bố cục & sprite ---------- */
    function layout() {
      const availW = Math.max(240, area.clientWidth);
      const twW = availW / (C + 0.9);
      let tw;
      if (R > C) {
        tw = Math.min(twW, 56);
      } else {
        const twH = (window.innerHeight - 250) / ((R + 0.8) * 1.2);
        tw = Math.min(twW, Math.max(twH, 30, twW * 0.55), 62);
      }
      tw = Math.max(16, Math.floor(tw));
      const th = Math.round(tw * 1.2), mx = Math.round(tw * 0.45), my = Math.round(th * 0.4);
      const W = C * tw + 2 * mx, H = R * th + 2 * my;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      L = { tw, th, mx, my, W, H, dpr };
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      $('tbar').style.maxWidth = W + 'px';
      buildSprites(); buildBg();
    }

    function makeCanvas(w, h) {
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * L.dpr)); c.height = Math.max(1, Math.round(h * L.dpr));
      const g = c.getContext('2d'); g.scale(L.dpr, L.dpr);
      return [c, g];
    }

    function buildSprites() {
      const { tw, th } = L;
      const rad = Math.max(3, tw * 0.16), lw = Math.max(1.2, tw * 0.05);
      const depth = Math.max(2, Math.round(th * 0.07));
      const faceH = th - depth - 1, pad = Math.max(2, tw * 0.1);
      sprites = ICONS.map((icon, i) => {
        const [c, g] = makeCanvas(tw, th);
        g.fillStyle = '#d9822b';
        g.beginPath(); g.roundRect(1, depth, tw - 2, faceH, rad); g.fill();
        const grad = g.createLinearGradient(0, 0, 0, faceH);
        grad.addColorStop(0, '#fffdf7'); grad.addColorStop(1, '#fff0d2');
        g.fillStyle = grad;
        g.beginPath(); g.roundRect(1, 0.5, tw - 2, faceH, rad); g.fill();
        g.strokeStyle = '#f4a259'; g.lineWidth = lw;
        g.beginPath(); g.roundRect(1 + lw / 2, 0.5 + lw / 2, tw - 2 - lw, faceH - lw, rad); g.stroke();
        const iw = tw - 2 * pad, ih = faceH - 2 * pad;
        g.fillStyle = PASTEL[i];
        g.beginPath(); g.roundRect(pad, pad + 0.5, iw, ih, rad * 0.7); g.fill();
        g.fillStyle = 'rgba(255,255,255,.45)';
        g.beginPath(); g.roundRect(pad + 1, pad + 1, iw - 2, ih * 0.35, rad * 0.6); g.fill();
        const fs = Math.floor(Math.min(iw, ih) * 0.84);
        g.font = `${fs}px ${EMOJI_FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#000';
        g.fillText(icon, tw / 2, pad + 0.5 + ih / 2 + fs * 0.06);
        return c;
      });
    }

    function buildBg() {
      const { W, H } = L;
      const [c, g] = makeCanvas(W, H);
      const grad = g.createLinearGradient(0, 0, W, H);
      grad.addColorStop(0, '#3b9be0'); grad.addColorStop(0.55, '#4fc3c8'); grad.addColorStop(1, '#6fd36a');
      g.fillStyle = grad; g.fillRect(0, 0, W, H);
      const step = Math.max(26, L.tw * 1.4);
      g.font = `${Math.round(step * 0.38)}px ${EMOJI_FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
      for (let y = 0, row = 0; y < H + step; y += step, row++) {
        for (let x = (row % 2) * step / 2; x < W + step; x += step) {
          g.fillStyle = 'rgba(255,255,255,.12)';
          g.beginPath(); g.arc(x, y, step * 0.18, 0, Math.PI * 2); g.fill();
          if ((row + Math.round(x / step)) % 3 === 0) {
            g.globalAlpha = 0.16; g.fillText('⚡', x + step / 2, y + step / 2); g.globalAlpha = 1;
          }
        }
      }
      g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2;
      g.beginPath(); g.roundRect(L.mx / 2, L.my / 2, W - L.mx, H - L.my, 10); g.stroke();
      bgCanvas = c;
    }

    const cellX = (c) => (c <= 0 ? L.mx / 2 : c >= C + 1 ? L.mx + C * L.tw + L.mx / 2 : L.mx + (c - 1) * L.tw + L.tw / 2);
    const cellY = (r) => (r <= 0 ? L.my / 2 : r >= R + 1 ? L.my + R * L.th + L.my / 2 : L.my + (r - 1) * L.th + L.th / 2);

    /* ---------- Bàn chơi ---------- */
    function rebuildGrid() {
      grid = Array.from({ length: R + 2 }, () => Array(C + 2).fill(null));
      tiles.forEach((t) => { grid[t.r][t.c] = t; });
    }

    function newLevel() {
      const portrait = area.clientWidth < 560 && window.innerHeight > window.innerWidth * 1.1;
      R = portrait ? 16 : 9; C = portrait ? 9 : 16;
      mode = modeFor(level);
      const pairs = (R * C) / 2, types = [];
      for (let i = 0; i < pairs; i++) { const t = i % ICONS.length; types.push(t, t); }
      shuffleArr(types);
      tiles = [];
      let k = 0;
      for (let r = 1; r <= R; r++) {
        for (let c = 1; c <= C; c++) {
          tiles.push({ type: types[k++], r, c, ar: r, ac: c, app: -((r + c) * 0.018), shake: 0 });
        }
      }
      rebuildGrid();
      if (!findMove()) reshuffle();
      timeMax = Math.max(180, 300 - (level - 1) * 15);
      timeLeft = timeMax; hints = 3; shuffles = 3;
      sel = null; hintPair = null; hintT = 0; combo = 0; lastMatchAt = -99;
      paths = []; ghosts = []; parts = []; floats = []; msg = null;
      layout(); hud();
    }

    /**
     * Tìm đường nối giữa 2 ô: tối đa 3 đoạn thẳng (2 lần rẽ), đi qua ô trống kể cả viền ngoài.
     * Trả về mảng điểm [a, góc..., b] hoặc null.
     */
    function findPath(a, b) {
      if (!a || !b || a === b || a.type !== b.type) return null;
      const RR = R + 2, CC = C + 2;
      const idx = (r, c) => r * CC + c;
      const seen = new Uint8Array(RR * CC);
      const par = new Int32Array(RR * CC).fill(-1);
      const start = idx(a.r, a.c);
      seen[start] = 1;
      let frontier = [start];
      for (let seg = 0; seg < 3; seg++) {
        const next = [];
        for (const o of frontier) {
          const or = Math.floor(o / CC), oc = o % CC;
          for (const [dr, dc] of DIRS) {
            let nr = or + dr, nc = oc + dc;
            while (nr >= 0 && nr < RR && nc >= 0 && nc < CC) {
              if (nr === b.r && nc === b.c) {
                const pts = [{ r: b.r, c: b.c }];
                let cur = o;
                while (cur !== start) { pts.push({ r: Math.floor(cur / CC), c: cur % CC }); cur = par[cur]; }
                pts.push({ r: a.r, c: a.c });
                return pts.reverse();
              }
              if (grid[nr][nc]) break;
              const i = idx(nr, nc);
              if (!seen[i]) { seen[i] = 1; par[i] = o; next.push(i); }
              nr += dr; nc += dc;
            }
          }
        }
        frontier = next;
      }
      return null;
    }

    function findMove() {
      const byType = {};
      tiles.forEach((t) => { (byType[t.type] = byType[t.type] || []).push(t); });
      for (const list of Object.values(byType)) {
        for (let i = 0; i < list.length; i++) {
          for (let j = i + 1; j < list.length; j++) {
            if (findPath(list[i], list[j])) return [list[i], list[j]];
          }
        }
      }
      return null;
    }

    function reshuffle() {
      if (tiles.length < 2) return;
      const pos = tiles.map((t) => [t.r, t.c]);
      for (let tries = 0; tries < 80; tries++) {
        shuffleArr(pos);
        tiles.forEach((t, i) => { t.r = pos[i][0]; t.c = pos[i][1]; });
        rebuildGrid();
        if (findMove()) return;
      }
    }

    function doShuffle(free) {
      reshuffle();
      sel = null; hintPair = null; hintT = 0;
      sfx.shuffle();
      msg = { text: free ? 'Hết đường nối — tự động đảo! 🔀' : 'Đảo bàn! 🔀', t: 1.4, color: '#ffe066' };
    }

    function applyGravity() {
      const id = mode.id;
      if (id === 'none') return;
      const lines = [];
      const range = (a, b) => { const out = []; const s = a <= b ? 1 : -1; for (let i = a; s > 0 ? i <= b : i >= b; i += s) out.push(i); return out; };
      const hc = Math.floor(C / 2), hr = Math.floor(R / 2);
      for (let c = 1; c <= C && (id === 'down' || id === 'up' || id === 'cy'); c++) {
        if (id === 'down') lines.push(range(R, 1).map((r) => [r, c]));
        else if (id === 'up') lines.push(range(1, R).map((r) => [r, c]));
        else { lines.push(range(hr, 1).map((r) => [r, c])); lines.push(range(hr + 1, R).map((r) => [r, c])); }
      }
      for (let r = 1; r <= R && (id === 'left' || id === 'right' || id === 'cx'); r++) {
        if (id === 'right') lines.push(range(C, 1).map((c) => [r, c]));
        else if (id === 'left') lines.push(range(1, C).map((c) => [r, c]));
        else { lines.push(range(hc, 1).map((c) => [r, c])); lines.push(range(hc + 1, C).map((c) => [r, c])); }
      }
      lines.forEach((line) => {
        const ts = line.map(([r, c]) => grid[r][c]).filter(Boolean);
        line.forEach(([r, c], i) => {
          const t = ts[i] || null;
          grid[r][c] = t;
          if (t) { t.r = r; t.c = c; }
        });
      });
    }

    /* ---------- Thao tác ---------- */
    function tapTile(t) {
      if (state !== 'play' || !t) return;
      audio();
      if (!sel) { sel = t; sfx.select(); return; }
      if (sel === t) { sel = null; return; }
      const path = sel.type === t.type ? findPath(sel, t) : null;
      if (!path) {
        sel.shake = 0.35; t.shake = 0.35;
        sfx.wrong();
        sel = null;
        return;
      }
      match(sel, t, path);
    }

    function match(a, b, path) {
      const pts = path.map((p) => ({ x: cellX(p.c), y: cellY(p.r) }));
      paths.push({ pts, t: 0.3 });
      [a, b].forEach((t) => {
        const x = cellX(t.c), y = cellY(t.r);
        ghosts.push({ type: t.type, x, y, t: 0.3 });
        for (let i = 0; i < 9; i++) {
          const ang = Math.random() * Math.PI * 2, sp = (0.6 + Math.random()) * L.tw * 3;
          parts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, t: 0.5 + Math.random() * 0.3, c: i % 3 === 0 ? '#fff' : i % 3 === 1 ? '#ffd43b' : PASTEL[t.type] });
        }
        grid[t.r][t.c] = null;
      });
      tiles = tiles.filter((t) => t !== a && t !== b);
      combo = clock - lastMatchAt < 4 ? combo + 1 : 1;
      lastMatchAt = clock;
      const gain = 20 + Math.min(combo - 1, 10) * 10;
      score += gain;
      const mid = pts[Math.floor(pts.length / 2)];
      floats.push({ text: '+' + gain, x: (pts[0].x + pts[pts.length - 1].x) / 2 || mid.x, y: (pts[0].y + pts[pts.length - 1].y) / 2 || mid.y, t: 1, color: combo > 1 ? '#ffd43b' : '#fff' });
      if (combo >= 2) msg = { text: `Combo x${combo}! 🔥`, t: 0.9, color: '#ffd43b' };
      sfx.match(combo);
      sel = null; hintPair = null; hintT = 0;
      applyGravity();
      hud();
      if (!tiles.length) { levelClear(); return; }
      if (!findMove()) doShuffle(true);
    }

    function useHint() {
      if (state !== 'play' || hints <= 0) return;
      let mv = findMove();
      if (!mv) { doShuffle(true); mv = findMove(); }
      if (!mv) return;
      hints--; hintPair = mv; hintT = 3.5; sel = null;
      sfx.hint(); hud();
    }

    function useShuffle() {
      if (state !== 'play' || shuffles <= 0) return;
      shuffles--; doShuffle(false); hud();
    }

    function hud() {
      $('score').textContent = score.toLocaleString('vi-VN');
      $('level').textContent = level;
      $('left').textContent = tiles.length;
      $('nHint').textContent = hints; $('nShuf').textContent = shuffles;
      $('bHint').disabled = hints <= 0 || state !== 'play';
      $('bShuf').disabled = shuffles <= 0 || state !== 'play';
      $('modeLbl').textContent = `${mode.icon} ${mode.name}`;
      $('bMute').textContent = muted ? '🔇' : '🔊';
    }

    function timeBar() {
      const ratio = Math.max(0, Math.min(1, timeLeft / timeMax));
      const f = $('tfill');
      f.style.width = (ratio * 100).toFixed(2) + '%';
      const hue = Math.round(ratio * 120);
      f.style.background = `linear-gradient(180deg, hsl(${hue},85%,62%), hsl(${hue},80%,40%))`;
      $('ttext').textContent = `⏱ ${Math.ceil(timeLeft)} giây`;
    }

    function levelClear() {
      state = 'between';
      const bonus = Math.ceil(Math.max(0, timeLeft)) * 10;
      score += bonus;
      hud(); sfx.win();
      const nextMode = modeFor(level + 1);
      setTimeout(() => {
        if (state !== 'between') return;
        GH.overlay(area, `<h2>🎉 Qua màn ${level}!</h2>
          <p>Thưởng thời gian: <b>+${bonus.toLocaleString('vi-VN')}</b><br>Tổng điểm: <b>${score.toLocaleString('vi-VN')}</b></p>
          <p>Màn ${level + 1}: ${nextMode.icon} <b>${nextMode.name}</b></p>`, 'Màn tiếp ▶', () => {
          level++; newLevel(); state = 'play'; hud();
        });
      }, 700);
    }

    function end() {
      state = 'over';
      sel = null; hintPair = null;
      hud(); sfx.lose();
      GH.gameOver(area, 'pikachu', score, { title: '⏰ Hết giờ!', note: `Đến màn ${level} · còn ${tiles.length} hình` }, start);
    }

    function start() {
      area.querySelectorAll('.overlay').forEach((o) => o.remove());
      audio();
      score = 0; level = 1; clock = 0;
      newLevel();
      state = 'play';
      hud();
    }

    /* ---------- Cập nhật & vẽ ---------- */
    function update(dt) {
      const k = Math.min(1, dt * 14);
      tiles.forEach((t) => {
        t.ar += (t.r - t.ar) * k; t.ac += (t.c - t.ac) * k;
        if (Math.abs(t.r - t.ar) < 0.002) t.ar = t.r;
        if (Math.abs(t.c - t.ac) < 0.002) t.ac = t.c;
        if (t.app < 1) t.app += dt;
        if (t.shake > 0) t.shake = Math.max(0, t.shake - dt);
      });
      paths.forEach((p) => { p.t -= dt; }); paths = paths.filter((p) => p.t > 0);
      ghosts.forEach((g) => { g.t -= dt; }); ghosts = ghosts.filter((g) => g.t > 0);
      parts.forEach((p) => { p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy = p.vy * 0.92 + 40 * dt; });
      parts = parts.filter((p) => p.t > 0);
      floats.forEach((f) => { f.t -= dt; f.y -= 30 * dt; }); floats = floats.filter((f) => f.t > 0);
      if (msg) { msg.t -= dt; if (msg.t <= 0) msg = null; }
      if (state !== 'play') return;
      clock += dt;
      timeLeft -= dt;
      if (hintT > 0) { hintT -= dt; if (hintT <= 0) hintPair = null; }
      if (timeLeft <= 10 && timeLeft > 0 && Math.ceil(timeLeft) !== lastTick) { lastTick = Math.ceil(timeLeft); sfx.tick(); }
      if (timeLeft <= 0) { timeLeft = 0; timeBar(); end(); return; }
      timeBar();
    }

    function glowRect(x, y, w, h, color, lw, blur) {
      ctx.save();
      ctx.shadowColor = color; ctx.shadowBlur = blur;
      ctx.strokeStyle = color; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.max(3, L.tw * 0.16)); ctx.stroke();
      ctx.restore();
    }

    function draw(time) {
      if (!L) return;
      const { tw, th, mx, my, W, H, dpr } = L;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.drawImage(bgCanvas, 0, 0, W, H);

      const order = [...tiles].sort((a, b) => a.ar - b.ar);
      for (const t of order) {
        let x = mx + (t.ac - 1) * tw, y = my + (t.ar - 1) * th;
        if (t.shake > 0) x += Math.sin(t.shake * 70) * tw * 0.09 * (t.shake / 0.35);
        const isSel = t === sel;
        const isHint = hintPair && (hintPair[0] === t || hintPair[1] === t);
        if (isSel) y -= th * 0.06;
        const s = Math.max(0, Math.min(1, t.app / 0.25));
        if (s <= 0) continue;
        if (s < 1) {
          const e = 1 - Math.pow(1 - s, 3);
          ctx.save(); ctx.translate(x + tw / 2, y + th / 2); ctx.scale(e, e);
          ctx.drawImage(sprites[t.type], -tw / 2, -th / 2, tw, th); ctx.restore();
        } else {
          ctx.drawImage(sprites[t.type], x, y, tw, th);
        }
        if (isSel) {
          ctx.fillStyle = 'rgba(255, 236, 80, .28)';
          ctx.beginPath(); ctx.roundRect(x + 1, y, tw - 2, th * 0.92, Math.max(3, tw * 0.16)); ctx.fill();
          glowRect(x + 1, y, tw - 2, th * 0.92, '#ffe600', Math.max(2.5, tw * 0.09), 14);
        } else if (isHint) {
          const a = 0.55 + 0.45 * Math.sin(time * 10);
          ctx.globalAlpha = a;
          glowRect(x + 1, y, tw - 2, th * 0.92, '#40ff9a', Math.max(2.5, tw * 0.09), 16);
          ctx.globalAlpha = 1;
        }
      }

      ghosts.forEach((g) => {
        const p = 1 - g.t / 0.3, s = 1 + p * 0.5;
        ctx.save(); ctx.globalAlpha = Math.max(0, 1 - p); ctx.translate(g.x, g.y); ctx.scale(s, s);
        ctx.drawImage(sprites[g.type], -tw / 2, -th / 2, tw, th); ctx.restore();
      });

      paths.forEach((p) => {
        const a = Math.min(1, p.t / 0.15);
        ctx.save(); ctx.globalAlpha = a; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        const line = (w, color, blur) => {
          ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.strokeStyle = color; ctx.lineWidth = w;
          ctx.beginPath(); p.pts.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y))); ctx.stroke();
        };
        line(Math.max(6, tw * 0.22), 'rgba(255, 210, 0, .75)', 18);
        line(Math.max(3, tw * 0.11), '#ff3b30', 8);
        line(Math.max(1.2, tw * 0.04), '#fff7c2', 0);
        ctx.restore();
      });

      parts.forEach((p) => {
        ctx.globalAlpha = Math.min(1, p.t * 2); ctx.fillStyle = p.c;
        const r = Math.max(1.5, tw * 0.07);
        ctx.beginPath();
        for (let i = 0; i < 8; i++) { const ang = (i * Math.PI) / 4, rr = i % 2 ? r * 0.4 : r; ctx.lineTo(p.x + Math.cos(ang) * rr, p.y + Math.sin(ang) * rr); }
        ctx.closePath(); ctx.fill();
      });
      ctx.globalAlpha = 1;

      const fsF = Math.max(14, Math.round(tw * 0.5));
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      floats.forEach((f) => {
        ctx.globalAlpha = Math.min(1, f.t * 2);
        ctx.font = `900 ${fsF}px "Be Vietnam Pro", system-ui`;
        ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(f.text, f.x, f.y);
        ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
      });
      ctx.globalAlpha = 1;
      if (msg) {
        const fs = Math.max(16, Math.min(30, Math.round(W / 22)));
        ctx.globalAlpha = Math.min(1, msg.t * 2);
        ctx.font = `900 ${fs}px "Be Vietnam Pro", system-ui`;
        ctx.lineWidth = 6; ctx.strokeStyle = '#1e3a8a'; ctx.strokeText(msg.text, W / 2, H / 2);
        ctx.fillStyle = msg.color; ctx.fillText(msg.text, W / 2, H / 2);
        ctx.globalAlpha = 1;
      }
    }

    function loop(t) {
      const dt = Math.min(0.05, (t - (last || t)) / 1000);
      last = t;
      update(dt);
      draw(t / 1000);
      requestAnimationFrame(loop);
    }

    /* ---------- Sự kiện ---------- */
    cv.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (!L) return;
      const rect = cv.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (L.W / rect.width), y = (e.clientY - rect.top) * (L.H / rect.height);
      const c = Math.floor((x - L.mx) / L.tw) + 1, r = Math.floor((y - L.my) / L.th) + 1;
      if (r < 1 || r > R || c < 1 || c > C) return;
      tapTile(grid[r][c]);
    });
    $('bHint').addEventListener('click', useHint);
    $('bShuf').addEventListener('click', useShuffle);
    $('bMute').addEventListener('click', () => { muted = !muted; GH.save('pk_mute', muted); hud(); if (!muted) sfx.select(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') useHint();
      else if (e.key === 's' || e.key === 'S') useShuffle();
    });
    let rsz = 0;
    window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(layout, 120); });

    newLevel();
    timeBar();
    requestAnimationFrame(loop);
    GH.overlay(area, `<h2>⚡ Pikachu</h2><p>Nối 2 hình <b>giống nhau</b> bằng đường đi <b>tối đa 2 lần rẽ</b>,<br>không cắt qua hình khác (được đi vòng ngoài viền).<br>Nối nhanh liên tiếp để ăn <b>combo</b>. Mỗi màn có 💡 ×3 và 🔀 ×3.<br>Từ màn 2 các hình sẽ <b>trượt dồn</b> theo nhiều hướng!</p>`, 'Bắt đầu', start);
  </script>
</body>
</html>
