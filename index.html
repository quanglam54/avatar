<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Nông Trại Vui Vẻ</title>
  <meta name="description" content="Game nông trại 2D phong cách Avatar tuổi thơ — chơi ngay trên trình duyệt.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐔</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2f9e44">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nông Trại">
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud-left">
    <div class="hud-row">
    <button class="av-btn menu" id="btnMenu" title="Menu"><i class="burger"></i><span>MENU</span></button>
    <button class="av-btn sq" id="btnMap" title="Bản đồ thành phố">🗺️</button>
    <button class="av-btn sq" id="btnChat" title="Tin nhắn">💬</button>
    <button class="av-btn sq" id="btnSocial" title="Bạn bè">👥</button>
    </div>
    <div class="hud-more">
    <button class="av-btn sq" id="btnQuest" title="Nhiệm vụ hằng ngày">📜</button>
    <button class="av-btn sq" id="btnWheel" title="Vòng quay may mắn">🎡</button>
    <button class="av-btn sq" id="btnDaily" title="Điểm danh & đổi quà">📅</button>
    <button class="av-btn sq" id="btnMusic" title="Nhạc nền">🎵</button>
    <button class="av-btn sq" id="btnMic" title="Bật mic để nói chuyện">🎙️</button>
    <button class="av-btn sq event-btn" id="btnEvent" title="Sự kiện Halloween">🎃</button>
    </div>
  </div>

  <div class="hud-right">
    <div class="money"><span class="coin"></span><b id="hudCoins">0</b></div>
    <div class="lvbox">
      <canvas id="hudAvatar"></canvas>
      <div class="hud-info">
        <b id="hudName">Người chơi</b>
        <div class="lv">Cấp <span id="hudLv">1</span> · <span id="hudXpText"></span></div>
        <div class="xpbar"><i id="hudXp"></i></div>
      </div>
    </div>
    <button class="net" id="netStatus" title="Người chơi online">⚪ Offline</button>
  </div>

  <div class="visit-bar" id="visitBar"></div>
  <div class="loc-banner" id="hudLoc">Nông trại</div>

  <div class="chatbar">
    <div class="chatlog" id="chatLog"></div>
    <div class="emotes" id="emotes"></div>
    <form id="chatForm" autocomplete="off">
      <button type="button" class="emo-toggle" id="emoToggle" title="Biểu cảm">😀</button>
      <input id="chatInput" maxlength="80" placeholder="Nói gì đó… (Enter)">
      <button class="send">Gửi</button>
    </form>
  </div>

  <button class="recenter-btn" id="recenterBtn" title="Về chỗ nhân vật">📍</button>
  <button class="action-btn" id="actionBtn"></button>
  <div class="quiz-bar" id="quizBar"></div>
  <button class="table-btn" id="tableBtn">🃏 Đang ngồi bàn — mở</button>
  <div class="table-view" id="tableView"></div>
  <div class="bil-view" id="bilView"></div>
  <button class="table-btn bil-btn" id="bilBtn">🎱 Đang chơi bi-a — mở</button>
  <div class="race-view" id="raceView"></div>
  <div class="arcade-view" id="arcadeView"></div>
  <div id="toasts"></div>
  <div id="panels"></div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/art.js"></script>
  <script src="js/art2.js"></script>
  <script src="js/pixel.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/net.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/social.js"></script>
  <script src="js/ride.js"></script>
  <script src="js/arena.js"></script>
  <script src="js/horse.js"></script>
  <script src="js/club.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/table.js"></script>
  <script src="js/billiard.js"></script>
  <script src="js/rps.js"></script>
  <script src="js/race.js"></script>
  <script src="js/music.js"></script>
  <script src="js/game.js"></script>
  <script>
    // Cài như app (PWA): giữ lời mời cài để nút 📲 trong Menu dùng
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.__installPrompt = e; });
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  </script>
</body>
</html>
